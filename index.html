<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>체크리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — top bar, one scrolling view per screen (home / missions / mission / input / output / settings), floating add button, bottom sheet for forms */
:root{
  --bg:#f2f4f1; --card:#ffffff; --fg:#1d2a24; --muted:#6c7a72; --line:#dfe5e0; --accent:#2f6b4f; --accent-soft:#e2eee7;
  --warn:#b4542d; --warn-soft:#f7e6dd; --gold:#b8860b; --gold-soft:#f6ecd2;
  --in:#3c5f9e; --in-soft:#e4ebf7; --out:#9a4f2c; --out-soft:#f6e7de;
  --hero:#21352b; --hero-fg:#f2f4f1;
  --display:"Gowun Batang",Georgia,serif; --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1c2420;--fg:#e4ebe6;--muted:#93a29a;--line:#2c3732;--accent:#7cc39e;--accent-soft:#233229;--warn:#ef9a74;--warn-soft:#3a2720;--gold:#e9c46a;--gold-soft:#3a3320;--in:#8fb0ec;--in-soft:#1f2a3c;--out:#eba680;--out-soft:#3a2a21;--hero:#2a4236;--hero-fg:#eef3ef;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:none;color:inherit;background:none;border-radius:12px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0;width:100%}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{flex:1;margin:0;font-family:var(--display);font-size:1.3rem;text-align:center;text-wrap:balance}
.iconbtn{width:40px;height:40px;display:grid;place-content:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--accent-soft);color:var(--fg)}
.iconbtn svg{width:22px;height:22px}

main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:4px calc(env(safe-area-inset-bottom,0px) + 96px);display:flex;flex-direction:column;gap:14px}

/* home: title block */
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:8px 4px}
.brand .logo{width:64px;height:64px;border-radius:18px;background:var(--accent);display:grid;place-content:center}
.brand .logo svg{width:34px;height:34px}
.brand h2{margin:0;font-family:var(--display);font-size:1.6rem}
.brand .date{color:var(--muted);font-size:.9rem}

/* main mission button */
.mission-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;background:var(--hero);color:var(--hero-fg);border-radius:16px;text-align:left}
.mission-btn .star{width:44px;height:44px;flex:none;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-content:center;color:var(--gold)}
.mission-btn .star svg{width:26px;height:26px}
.mission-btn .mb-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mission-btn .mb-title{font-weight:600;font-size:1.05rem}
.mission-btn .mb-sub{font-size:.85rem;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{opacity:.6;font-size:1.3rem;flex:none}

/* input / output tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:16px;text-align:left;min-height:150px;border:1px solid transparent}
.tile.input{background:var(--in-soft);color:var(--in)}
.tile.output{background:var(--out-soft);color:var(--out)}
.tile .numeral{font-family:var(--display);font-size:2.2rem;line-height:1}
.tile .t-name{font-weight:600;font-size:1.1rem;color:var(--fg)}
.tile .t-desc{font-size:.8rem;color:var(--muted);line-height:1.35}
.tile .t-count{margin-top:auto;font-size:.85rem;font-weight:500;font-variant-numeric:tabular-nums}

/* section heads */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec h3{margin:0;font-size:.95rem;font-weight:600}
.sec span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:.82rem;color:var(--muted)}

/* task rows (cards) */
.rows{display:flex;flex-direction:column;gap:8px}
.row-card{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.row-card.p3{border-left:4px solid var(--warn)}
.row-card.p2{border-left:4px solid var(--gold)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;padding:0;border-radius:6px}
.row-text{word-break:break-word;font-weight:500}
.row-amount{font-size:.86rem}
.row-amount b{color:var(--accent);font-weight:600}
.row-amount span{color:var(--muted)}
.meta{display:flex;gap:5px;flex-wrap:wrap;font-size:.75rem;align-items:center}
.tag{padding:1px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.input{background:var(--in-soft);color:var(--in)}
.tag.output{background:var(--out-soft);color:var(--out)}
.tag.plain{background:var(--accent-soft);color:var(--fg)}
.tag.mission{background:var(--gold-soft);color:var(--gold)}
.tag.late,.tag.today{background:var(--warn-soft);color:var(--warn)}
.tag.late{font-weight:600}
.tag.quest{background:transparent;border:1px solid var(--line);color:var(--muted)}
.check{width:30px;height:30px;flex:none;border:2px solid var(--muted);border-radius:8px;display:grid;place-content:center}
.check.round{border-radius:50%}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"]::after{content:"";width:8px;height:14px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.row-card.done .row-text{color:var(--muted);text-decoration:line-through}
.row-card.done .meta,.row-card.done .row-amount{opacity:.55}
.more{padding:12px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);width:100%;font-size:.92rem}
.more:hover{color:var(--fg);border-color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.92rem;background:var(--card);border:1px dashed var(--line);border-radius:14px}

/* missions */
.m-card{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;width:100%}
.m-head{display:flex;align-items:center;gap:10px}
.m-title{flex:1;min-width:0;font-weight:600;font-size:1.05rem;word-break:break-word}
.lv{font-family:var(--display);font-size:.95rem;padding:2px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.xp{display:flex;flex-direction:column;gap:4px}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:5px;transition:width .5s}
.xp small{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.m-hero{background:var(--hero);color:var(--hero-fg);border:none}
.m-hero .xp small{color:var(--hero-fg);opacity:.8}
.m-hero .xpbar{background:rgba(255,255,255,.15)}
.m-hero .m-title{font-family:var(--display);font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.08)}
.stat b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;opacity:.8}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1}
.btn{padding:10px 16px;background:var(--accent);color:var(--bg);font-weight:600;white-space:nowrap}
.btn.soft{background:var(--accent-soft);color:var(--fg)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 120px}

/* group screen */
.group-head{padding:16px;border-radius:16px;display:flex;flex-direction:column;gap:4px}
.group-head.input{background:var(--in-soft)}
.group-head.output{background:var(--out-soft)}
.group-head .numeral{font-family:var(--display);font-size:1.6rem}
.group-head.input .numeral{color:var(--in)}
.group-head.output .numeral{color:var(--out)}
.group-head p{margin:0;font-size:.88rem;color:var(--muted)}
.q-card{display:flex;flex-direction:column;gap:6px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.q-card .bar2{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.q-card .bar2 span{display:block;height:100%;background:var(--accent)}
.q-info{font-size:.82rem;color:var(--muted)}
details.done-box summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:6px 0}
details.done-box .rows{margin-top:8px}

/* settings */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:.95rem}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.subchip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border-radius:999px;font-size:.88rem}
.subchip button{padding:0 6px;font-size:1rem;line-height:1;opacity:.7}

/* fab */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--bg);font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:6;display:grid;place-content:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-family:var(--display);font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:.82rem;color:var(--muted)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg.group button[data-v=input][aria-pressed="true"]{background:var(--in-soft);color:var(--in)}
.seg.group button[data-v=output][aria-pressed="true"]{background:var(--out-soft);color:var(--out)}
.seg.prio button[data-v="3"][aria-pressed="true"]{background:var(--warn-soft);color:var(--warn)}
.seg.prio button[data-v="2"][aria-pressed="true"]{background:var(--gold-soft);color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;font-size:.9rem}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.plan{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;background:var(--bg)}
.plan input{background:var(--card)}
.plan .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .r input{width:96px}
.plan .r span{font-size:.85rem;color:var(--muted)}
.preview{font-size:.9rem;color:var(--accent);font-weight:500}
.preview.err{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (max-width:360px){.tiles{gap:8px}.tile{padding:12px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.xpbar span{transition:none}}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="backBtn" aria-label="뒤로" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="iconbtn" id="backSpacer" aria-hidden="true"></span>
  <h1 id="screenTitle">체크리스트</h1>
  <button class="iconbtn" id="settingsBtn" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="추가">+</button>
<div id="sheetRoot"></div>

<script>
(function(){
"use strict";
/* ================= data ================= */
const LS="checklist-v4", OLD=["todo-items-v3","todo-items-v1"];
const DAYS=["일","월","화","수","목","금","토"], ORDER=[1,2,3,4,5,6,0];
const GROUPS={input:"인풋",output:"아웃풋"};
const GDESC={input:"독서·공부·영화·액티비티처럼 경험하고 받아들이는 것",output:"그림·글쓰기처럼 직접 만들어 내는 것"};
const PRIO={3:"높음",2:"보통",1:"낮음"};
let S={items:[],quests:[],missions:[],subs:{input:["독서","공부","영화","액티비티"],output:["그림","글쓰기","만들기"]}};
let homeLimit=8;

const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));

function load(){
  let raw=null;
  try{raw=localStorage.getItem(LS);if(!raw)for(const k of OLD){raw=localStorage.getItem(k);if(raw)break;}}catch(e){}
  if(raw){try{merge(JSON.parse(raw));}catch(e){}}
}
function merge(d){
  if(!d) return;
  if(Array.isArray(d.items)) S.items=d.items.map(i=>{
    const o={...i};
    if(o.group===undefined){const c=o.cat||"";delete o.cat;if(c==="영화"){o.group="input";o.sub="영화";}else if(c==="자기개발"){o.group="input";o.sub="공부";}else{o.group="";o.sub=c;}}
    if(!o.prio)o.prio=2; if(o.mission===undefined)o.mission="";
    if(o.done&&!o.doneAt)o.doneAt="";
    return o;
  });
  if(Array.isArray(d.quests)) S.quests=d.quests.map(q=>({mission:"",prio:2,...q,log:q.log||{}}));
  if(Array.isArray(d.missions)) S.missions=clone(d.missions);
  if(d.subs&&d.subs.input&&d.subs.output) S.subs=clone(d.subs);
}
function save(){
  try{localStorage.setItem(LS,JSON.stringify({v:4,...S}));}catch(e){toast("저장 공간에 저장하지 못했어요.");}
}

/* ================= quest math ================= */
function countSessions(days,start,span){let n=0;const d=parse(start);for(let i=0;i<span;i++){if(days.includes(d.getDay()))n++;d.setDate(d.getDate()+1);}return n;}
const doneBefore=(q,day)=>Object.keys(q.log||{}).filter(k=>q.log[k]&&k<day).length;
const doneTotal=q=>Object.keys(q.log||{}).filter(k=>q.log[k]).length;
function chunk(q,day){const p=q.plan,idx=doneBefore(q,day);const from=idx*p.per+1,to=Math.min(p.total,(idx+1)*p.per);return{idx,from,to,amt:to-from+1};}
const finished=q=>q.plan&&doneTotal(q)>=q.plan.sessions;
function isTodayQuest(q){
  const t=today(); if(!q.days.includes(new Date().getDay())) return false;
  if(q.plan&&t<q.plan.start) return false;
  if(q.plan&&doneBefore(q,t)>=q.plan.sessions) return false;
  return true;
}
function nextDay(q){const d=new Date();for(let i=1;i<=7;i++){d.setDate(d.getDate()+1);if(q.days.includes(d.getDay()))return i===1?"내일":DAYS[d.getDay()]+"요일";}return "";}
const daysLeft=due=>due?Math.round((parse(due)-parse(today()))/86400000):Infinity;

/* ================= mission XP ================= */
// 할 일 만들기 +10 · 할 일 완료 +30 · 퀘스트 만들기 +10 · 퀘스트 1회 완료 +15
function missionStats(m){
  const its=S.items.filter(i=>i.mission===m.id), qs=S.quests.filter(q=>q.mission===m.id);
  const done=its.filter(i=>i.done).length, checks=qs.reduce((a,q)=>a+doneTotal(q),0);
  const xp=its.length*10+done*30+qs.length*10+checks*15;
  let lv=1,rest=xp,need=100;
  while(rest>=need){rest-=need;lv++;need=100+(lv-1)*50;}
  return {its,qs,made:its.length+qs.length,done,checks,xp,lv,rest,need};
}

/* ================= shared row builders ================= */
function tagsFor(o,{showMission=true}={}){
  const m=el("span","meta");
  if(o.group){m.appendChild(el("span","tag "+o.group,GROUPS[o.group]+(o.sub?" · "+o.sub:"")));}
  if(showMission&&o.mission){const mi=S.missions.find(x=>x.id===o.mission);if(mi)m.appendChild(el("span","tag mission","★ "+mi.title));}
  return m;
}
function dueTag(it){
  if(!it.due) return null;
  const n=daysLeft(it.due), d=parse(it.due);
  const cls=it.done?"plain":n<0?"late":n===0?"today":"plain";
  return el("span","tag "+cls,`${d.getMonth()+1}/${d.getDate()} · `+(n<0?`${-n}일 지남`:n===0?"오늘 마감":`D-${n}`));
}
function checkBtn(on,round,label,fn){
  const b=el("button","check"+(round?" round":""));b.setAttribute("role","checkbox");b.setAttribute("aria-checked",String(on));b.setAttribute("aria-label",label);
  b.addEventListener("click",fn);return b;
}
function taskRow(it,opts={}){
  const c=el("div","row-card"+(it.done?" done":"")+(!it.done&&it.prio==3?" p3":!it.done&&it.prio==2&&opts.showPrio?" p2":""));
  const main=el("button","row-main"); main.type="button";
  main.appendChild(el("span","row-text",it.text));
  const m=tagsFor(it,opts); const dt=dueTag(it); if(dt) m.prepend(dt);

function sortTasks(arr){
  return arr.slice().sort((a,b)=>{
    const da=a._quest?0:daysLeft(a.due), db=b._quest?0:daysLeft(b.due);
    if(da!==db) return da-db;
    if((b.prio||2)!==(a.prio||2)) return (b.prio||2)-(a.prio||2);
    return (a.created||0)-(b.created||0);
  });
}

}

function route(){const h=location.hash.replace(/^#\/?/,"");return h||"home";}
function go(r,replace){if(replace){history.replaceState(null,"","#/"+r);lastRoute=r;render();}else location.hash="#/"+r;}
function setTitle(t){$("screenTitle").textContent=t;}
function render(){
  const r=route(), v=$("view"); const y=window.scrollY;
  v.innerHTML="";
  const home=r==="home";
  $("backBtn").hidden=home; $("backSpacer").hidden=!home;
  $("fab").hidden=r==="settings";
  if(home){setTitle("");screenHome(v);}
  else if(r==="missions"){setTitle("메인 미션");screenMissions(v);}

  else if(r==="settings"){setTitle("설정");screenSettings(v);}
  else {go("home",true);return render();}
  window.scrollTo(0,y);
}

function openSheet(o){
  closeSheet();
  const root=$("sheetRoot");
  const scrim=el("div","scrim");scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet();});
  const sh=el("form","sheet");sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.autocomplete="off";
  scrim.appendChild(sh);root.appendChild(scrim);document.body.style.overflow="hidden";

    const m=S.missions.find(x=>x.id===o.id);
    sh.appendChild(el("h3",null,"메인 미션"));
    const i=el("input");i.type="text";i.value=m.title;i.maxLength=60;i.id="missionTitle";
    sh.appendChild(field("이름",i));
    const br=el("div","btnrow");const sv=el("button","btn","저장");sv.type="submit";
    const del=el("button","btn danger","미션 삭제");del.type="button";
    let armed=false;
    del.addEventListener("click",()=>{if(!armed){armed=true;del.textContent="한 번 더 누르면 삭제돼요";return;}
      S.missions=S.missions.filter(x=>x.id!==m.id);[...S.items,...S.quests].forEach(x=>{if(x.mission===m.id)x.mission="";});save();closeSheet();go("missions",true);toast("미션을 삭제했어요. 연결된 할 일은 남아 있어요.");});
    br.append(sv,del);sh.appendChild(br);
    sh.addEventListener("submit",e=>{e.preventDefault();const t=i.value.trim();if(!t)return;m.title=t;save();closeSheet();render();});
    i.focus();return;
  }

  const editing=o.mode==="edit-task"||o.mode==="edit-quest";
  const src=o.mode==="edit-task"?S.items.find(x=>x.id===o.id):o.mode==="edit-quest"?S.quests.find(x=>x.id===o.id):null;
  const st={
    kind:o.mode==="edit-quest"?"quest":"task",
    group:src?(src.group||"input"):(o.group||"input"),
    sub:src?(src.sub||""):(o.sub||""),
    mission:src?(src.mission||""):(o.mission||""),
    prio:src?(src.prio||2):2,
    days:src&&src.days?src.days.slice():[], usePlan:false
  };
  sh.appendChild(el("h3",null,editing?(st.kind==="quest"?"반복 퀘스트 수정":"할 일 수정"):"새로 추가"));
  if(!editing) sh.appendChild(seg("",[["task","할 일"],["quest","반복 퀘스트"]],st.kind,v=>{st.kind=v;sync();}));

  const title=el("input");title.type="text";title.id="f-title";title.maxLength=200;title.placeholder="예: 『코스모스』 읽기";
  title.value=src?(src.text||src.title||""):"";
  sh.appendChild(field("제목",title));

  sh.appendChild(field("큰 카테고리",seg("group",[["input","Ⅰ 인풋"],["output","Ⅱ 아웃풋"]],st.group,v=>{st.group=v;st.sub="";fillSubs();})));
  const sub=el("select");sub.id="f-sub";
  const newSub=el("input");newSub.type="text";newSub.id="f-newsub";newSub.placeholder="새 세부 카테고리 이름";newSub.maxLength=20;newSub.hidden=true;
  function fillSubs(){
    sub.innerHTML="";const add=(v,t)=>{const op=el("option",null,t);op.value=v;sub.appendChild(op);};
    add("","없음");const list=S.subs[st.group].slice();if(st.sub&&!list.includes(st.sub))list.push(st.sub);list.forEach(s=>add(s,s));add("__new","+ 새로 추가…");
    sub.value=st.sub;newSub.hidden=true;
  }
  sub.addEventListener("change",()=>{newSub.hidden=sub.value!=="__new";if(sub.value!=="__new")st.sub=sub.value;else newSub.focus();});
  fillSubs();
  const subWrap=el("div","field");subWrap.append(el("span","lbl","세부 카테고리"),sub,newSub);

  const mis=el("select");mis.id="f-mission";
  const mo=(v,t)=>{const op=el("option",null,t);op.value=v;mis.appendChild(op);};
  mo("","연결 안 함");S.missions.forEach(m=>mo(m.id,"★ "+m.title));mis.value=st.mission;
  mis.addEventListener("change",()=>st.mission=mis.value);
  const misWrap=field("메인 미션",mis);
  if(!S.missions.length){const h=el("span","hint","메인 미션 화면에서 큰 목표를 먼저 만들면 여기서 연결할 수 있어요.");misWrap.appendChild(h);}
  const two=el("div","two");two.append(subWrap,misWrap);sh.appendChild(two);

  sh.appendChild(field("중요도",seg("prio",[["1","낮음"],["2","보통"],["3","높음"]],st.prio,v=>st.prio=+v)));

  // task-only
  const due=el("input");due.type="date";due.id="f-due";due.value=src&&src.due?src.due:"";
  const dueWrap=field("희망 마감일",due);
  sh.appendChild(dueWrap);

  // quest-only
  const qWrap=el("div","field");
  const dayBox=el("div","days");
  ORDER.forEach(d=>{const b=el("button",null,DAYS[d]);b.type="button";b.setAttribute("aria-pressed",String(st.days.includes(d)));b.setAttribute("aria-label",DAYS[d]+"요일");
    b.disabled=editing;
    b.addEventListener("click",()=>{if(st.days.includes(d))st.days=st.days.filter(x=>x!==d);else st.days.push(d);b.setAttribute("aria-pressed",String(st.days.includes(d)));dErr.hidden=true;preview();});dayBox.appendChild(b);});
  const dErr=el("span","preview err","반복할 요일을 하나 이상 골라 주세요.");dErr.hidden=true;
  qWrap.append(el("span","lbl","반복 요일"),dayBox,dErr);
  const plan=el("div","plan");plan.hidden=true;
  const total=el("input");total.type="number";total.min="1";total.inputMode="numeric";total.placeholder="320";total.id="f-total";total.setAttribute("aria-label","총 분량");
  const unit=el("input");unit.type="text";unit.value="페이지";unit.maxLength=8;unit.id="f-unit";unit.setAttribute("aria-label","단위");
  const span=el("input");span.type="number";span.min="1";span.inputMode="numeric";span.placeholder="14";span.id="f-span";span.setAttribute("aria-label","기간(일)");
  const r1=el("div","r");r1.append(el("span",null,"총 분량"),total,unit);
  const r2=el("div","r");r2.append(el("span",null,"오늘부터"),span,el("span",null,"일 동안"));
  const pv=el("div","preview","총 분량과 기간을 넣으면 한 번에 할 분량을 계산해 드려요.");
  plan.append(r1,r2,pv);
  const tg=el("label","toggle");const cb=el("input");cb.type="checkbox";cb.id="f-useplan";tg.append(cb,"분량을 나눠서 하기 (예: 책 페이지)");
  cb.addEventListener("change",()=>{st.usePlan=cb.checked;plan.hidden=!cb.checked;preview();});
  [total,span,unit].forEach(x=>x.addEventListener("input",preview));
  if(!editing){qWrap.append(tg,plan);}
  else {
    const q=src;if(q&&q.days){const info=q.plan?`${q.plan.total}${q.plan.unit}를 ${q.plan.sessions}회에 나눠서 (한 번에 ${q.plan.per}${q.plan.unit})`:"분량 나누기 없음";
      qWrap.appendChild(el("span","hint",info+" · 요일과 분량은 바꿀 수 없어요. 바꾸려면 삭제 후 새로 만들어 주세요."));}
  }
  sh.appendChild(qWrap);

  function calc(){
    const T=parseInt(total.value,10),N=parseInt(span.value,10);
    if(!st.days.length) return {err:"반복할 요일을 먼저 골라 주세요."};
    if(!(T>0)||!(N>0)) return {err:"총 분량과 기간을 넣으면 한 번에 할 분량을 계산해 드려요."};
    const n=countSessions(st.days,today(),N); if(!n) return {err:"이 기간 안에 고른 요일이 없어요. 기간을 늘려 주세요."};
    return {total:T,span:N,sessions:n,per:Math.ceil(T/n),unit:unit.value.trim()||"페이지"};
  }
  function preview(){
    if(plan.hidden) return; const c=calc();
    if(c.err){pv.textContent=c.err;pv.classList.add("err");return;}
    pv.classList.remove("err");const e=new Date();e.setDate(e.getDate()+c.span-1);
    pv.textContent=`총 ${c.sessions}회 · 한 번에 ${c.per}${c.unit}씩 (${e.getMonth()+1}/${e.getDate()}까지)`;
  }
  function sync(){dueWrap.hidden=st.kind!=="task";qWrap.hidden=st.kind!=="quest";save1.textContent=editing?"저장":(st.kind==="quest"?"반복 퀘스트 추가":"할 일 추가");}

  const br=el("div","btnrow");const save1=el("button","btn");save1.type="submit";br.appendChild(save1);
  if(editing){
    const del=el("button","btn danger","삭제");del.type="button";let armed=false;
    del.addEventListener("click",()=>{if(!armed){armed=true;del.textContent="한 번 더 누르면 삭제";return;}
      if(st.kind==="task")S.items=S.items.filter(x=>x.id!==src.id);else S.quests=S.quests.filter(x=>x.id!==src.id);
      save();closeSheet();render();toast("삭제했어요.");});
    br.appendChild(del);
  }
  sh.appendChild(br);
  sync();

  sh.addEventListener("submit",e=>{
    e.preventDefault();
    const t=title.value.trim();if(!t){title.focus();return;}
    if(sub.value==="__new"){const n=newSub.value.trim();if(!n){newSub.focus();return;}if(!S.subs[st.group].includes(n))S.subs[st.group].push(n);st.sub=n;}
    if(editing){
      if(st.kind==="task"){src.text=t;src.due=due.value||"";}else src.title=t;
      Object.assign(src,{group:st.group,sub:st.sub,mission:st.mission,prio:st.prio});
      save();closeSheet();render();toast("저장했어요.");return;
    }
    if(st.kind==="task"){
      S.items.push({id:uid(),text:t,done:false,doneAt:"",group:st.group,sub:st.sub,mission:st.mission,prio:st.prio,due:due.value||"",created:Date.now()});
    } else {
      if(!st.days.length){dErr.hidden=false;return;}
      let p=null;if(st.usePlan){const c=calc();if(c.err){pv.textContent=c.err;pv.classList.add("err");return;}p={total:c.total,unit:c.unit,sessions:c.sessions,per:c.per,start:today()};}
      S.quests.push({id:uid(),title:t,group:st.group,sub:st.sub,mission:st.mission,prio:st.prio,days:st.days.slice(),plan:p,log:{},created:Date.now()});
    }
    save();closeSheet();render();
    if(st.mission)xpToast(st.mission,10);else toast("추가했어요.");
  });
  if(!editing) setTimeout(()=>title.focus(),50);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

/* ================= boot ================= */
load(); render();
let lastDay=today();
setInterval(()=>{if(today()!==lastDay){lastDay=today();render();}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&today()!==lastDay){lastDay=today();render();}});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
})();
</script>
</body>
</html>
