<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>체크리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — top bar, one scrolling view per screen (home / missions / mission / input / output / settings), floating add button, bottom sheet for forms */
:root{
  --bg:#f2f4f1; --card:#ffffff; --fg:#1d2a24; --muted:#6c7a72; --line:#dfe5e0; --accent:#2f6b4f; --accent-soft:#e2eee7;
  --warn:#b4542d; --warn-soft:#f7e6dd; --gold:#b8860b; --gold-soft:#f6ecd2;
  --in:#3c5f9e; --in-soft:#e4ebf7; --out:#9a4f2c; --out-soft:#f6e7de; --etc:#5d6670; --etc-soft:#e6e9ec; --wish:#6b4fa0; --wish-soft:#ece6f5;
  --h0:#b4473a; --h0s:#f7e3df; --h1:#b0601a; --h1s:#f8e7d6; --h2:#8a6d00; --h2s:#f5edcc; --h3:#3f7d3a; --h3s:#e1f0dd; --h4:#22776f; --h4s:#d9efec;
  --h5:#3c5f9e; --h5s:#e0e9f7; --h6:#5a4fb0; --h6s:#e7e4f8; --h7:#8a46a8; --h7s:#f0e2f6; --h8:#b03f78; --h8s:#f8e0ec; --h9:#7a5a3a; --h9s:#efe6dc; --h10:#5d6670; --h10s:#e6e9ec;
  --wood:#c9a477; --wood-dark:#9c7748; --cabinet:#f6efe4; --bronze:#b0743c; --silver:#98a2ad; --goldcup:#d4a017;
  --btn-bg:#2f6b4f; --btn-fg:#f2f4f1; --go-bg:#2f6b4f; --go-fg:#f2f4f1; --go-ic:rgba(255,255,255,.18); --hero:#dbe8e0; --hero-fg:#1d2a24; --hero-chip:rgba(255,255,255,.65); --hero-track:rgba(29,42,36,.12);
  --display:"Gowun Batang",Georgia,serif; --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1c2420;--fg:#e4ebe6;--muted:#93a29a;--line:#2c3732;--accent:#7cc39e;--accent-soft:#233229;--warn:#ef9a74;--warn-soft:#3a2720;--gold:#e9c46a;--gold-soft:#3a3320;--in:#8fb0ec;--in-soft:#1f2a3c;--out:#eba680;--out-soft:#3a2a21;--etc:#b4bcc5;--etc-soft:#262d33;--h0:#f0998b;--h0s:#3d2421;--h1:#efaa6c;--h1s:#3b2a1b;--h2:#e3c45a;--h2s:#35301a;--h3:#8fcf86;--h3s:#1f3320;--h4:#6fd0c4;--h4s:#17332f;--h5:#8fb0ec;--h5s:#1f2a3c;--h6:#aaa2f0;--h6s:#272440;--h7:#d39cec;--h7s:#33213b;--h8:#f095c2;--h8s:#3b2030;--h9:#d2b08a;--h9s:#33281d;--h10:#b4bcc5;--h10s:#262d33;--wish:#b9a1ec;--wish-soft:#2a2338;--wood:#7a5a3a;--wood-dark:#553e27;--cabinet:#211c17;--btn-bg:#3c6b53;--btn-fg:#eef6f1;--go-bg:#24382e;--go-fg:#cfe6d9;--go-ic:rgba(124,195,158,.16);--hero:#22302a;--hero-fg:#e4ebe6;--hero-chip:rgba(255,255,255,.07);--hero-track:rgba(255,255,255,.12);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:none;color:inherit;background:none;border-radius:12px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0;width:100%}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{flex:1;margin:0;font-family:var(--display);font-size:1.3rem;text-align:center;text-wrap:balance}
.iconbtn{width:40px;height:40px;display:grid;place-content:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--accent-soft);color:var(--fg)}
.iconbtn svg{width:22px;height:22px}

main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:4px calc(env(safe-area-inset-bottom,0px) + 96px);display:flex;flex-direction:column;gap:14px}

/* home: title block */
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:8px 4px}
.brand .logo{width:64px;height:64px;border-radius:18px;background:var(--accent);display:grid;place-content:center}
.brand .logo svg{width:34px;height:34px}
.brand h2{margin:0;font-family:var(--display);font-size:1.6rem}
.brand .date{color:var(--muted);font-size:.9rem}

/* main mission button */
.mission-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;background:var(--hero);color:var(--hero-fg);border-radius:16px;text-align:left}
.mission-btn .star{width:44px;height:44px;flex:none;border-radius:12px;background:var(--hero-chip);display:grid;place-content:center;color:var(--gold)}
.mission-btn .star svg{width:26px;height:26px}
.mission-btn .mb-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mission-btn .mb-title{font-weight:600;font-size:1.05rem}
.mission-btn .mb-sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{opacity:.6;font-size:1.3rem;flex:none}

/* input / output tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:16px;text-align:left;min-height:128px;border:1px solid transparent}
.tile.input{background:var(--in-soft);color:var(--in)}
.tile.output{background:var(--out-soft);color:var(--out)}
.tile.etc,.tile.wish{min-height:104px}
.tile.wish{background:var(--wish-soft);color:var(--wish)}
.tile .numeral{font-family:var(--display);font-size:2.2rem;line-height:1}
.tile .t-name{font-weight:600;font-size:1.1rem;color:var(--fg)}
.tile .t-desc{font-size:.8rem;color:var(--muted);line-height:1.35}
.tile .t-count{margin-top:auto;font-size:.85rem;font-weight:500;font-variant-numeric:tabular-nums}

/* section heads */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec h3{margin:0;font-size:.95rem;font-weight:600}
.sec span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:.82rem;color:var(--muted)}

/* task rows (cards) */
.rows{display:flex;flex-direction:column;gap:8px}
.row-card{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.row-card.p3{box-shadow:inset 4px 0 0 var(--warn)}
.row-card.p2{box-shadow:inset 4px 0 0 var(--gold)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;padding:0;border-radius:6px}
.row-text{word-break:break-word;font-weight:500}
.row-amount{font-size:.86rem}
.row-amount b{color:var(--accent);font-weight:600}
.row-amount span{color:var(--muted)}
.meta{display:flex;gap:5px;flex-wrap:wrap;font-size:.75rem;align-items:center}
.tag{padding:1px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.input{background:var(--in-soft);color:var(--in)}
.tag.output{background:var(--out-soft);color:var(--out)}
.tag.etc{background:var(--etc-soft);color:var(--etc)}
.tag.wish{background:var(--wish-soft);color:var(--wish)}
.tag.plain{background:var(--accent-soft);color:var(--fg)}
.tag.mission{background:var(--gold-soft);color:var(--gold)}
.tag.late,.tag.today{background:var(--warn-soft);color:var(--warn)}
.tag.late{font-weight:600}
.tag.quest{background:transparent;border:1px solid var(--line);color:var(--muted)}
.check{width:30px;height:30px;flex:none;border:2px solid var(--muted);border-radius:8px;display:grid;place-content:center}
.check.round{border-radius:50%}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"]::after{content:"";width:8px;height:14px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.row-card.done .row-text{color:var(--muted);text-decoration:line-through}
.row-card.done .meta,.row-card.done .row-amount{opacity:.55}
.more{padding:12px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);width:100%;font-size:.92rem}
.more:hover{color:var(--fg);border-color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.92rem;background:var(--card);border:1px dashed var(--line);border-radius:14px}

/* missions */
.m-card{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;width:100%}
.m-head{display:flex;align-items:center;gap:10px}
.m-title{flex:1;min-width:0;font-weight:600;font-size:1.05rem;word-break:break-word}
.lv{font-family:var(--display);font-size:.95rem;padding:2px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.xp{display:flex;flex-direction:column;gap:4px}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:5px;transition:width .5s}
.xp small{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.m-hero{background:var(--hero);color:var(--hero-fg);border:none}
.m-hero .xp small{color:var(--muted)}
.m-hero .xpbar{background:var(--hero-track)}
.m-hero .m-title{font-family:var(--display);font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:10px;background:var(--hero-chip)}
.stat b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1}
.btn{padding:10px 16px;background:var(--btn-bg);color:var(--btn-fg);font-weight:600;white-space:nowrap}
.btn.soft{background:var(--accent-soft);color:var(--fg)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 120px}

/* group screen */
.dust-card{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 10px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left;color:var(--fg)}
.dust-cv{display:block;width:84px;height:100px;flex:none}
.dust-tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.dust-tx .dt-k{font-size:.72rem;letter-spacing:.08em;color:var(--muted)}
.dust-tx b{font-family:var(--display);font-size:1.25rem;font-weight:700}
.dust-tx .dt-s{font-size:.8rem;color:var(--muted)}
.dust-card .chev{font-size:1.3rem;color:var(--muted)}
.dust-jar{display:flex;justify-content:center;padding:8px 0 4px}
.dust-cv.big{width:100%;max-width:340px;height:300px}
.hold-link{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px dashed var(--line);background:var(--card);color:var(--fg);text-align:left}
.hold-link .hl-ic{width:28px;height:28px;border-radius:50%;display:grid;place-content:center;background:var(--accent-soft);color:var(--accent);line-height:0}
.hold-link .hl-ic svg{width:14px;height:14px}
.hold-link .hl-t{flex:1;font-weight:600;font-size:.9rem}
.hold-link .chev{color:var(--muted);font-size:1.2rem}
.hold-row{align-items:center}
.hold-row .hold-go{flex:none;padding:8px 12px;font-size:.85rem}
.hold-row .row-text{color:var(--muted)}
.q-card.held{opacity:.7}
.dust-legend{display:flex;flex-wrap:wrap;gap:6px}
.dl-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:.85rem}
.dl-chip small{color:var(--muted)}
.dl-chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dl-dot{width:9px;height:9px;border-radius:50%;background:var(--hc)}
.done-row{width:100%;text-align:left;color:var(--fg)}
.done-row .row-main{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.dr-undo{display:flex}
.group-head{padding:16px;border-radius:16px;display:flex;flex-direction:column;gap:4px}
.group-head.input{background:var(--in-soft)}
.group-head.output{background:var(--out-soft)}
.group-head.etc{background:var(--etc-soft)}
.group-head.wish{background:var(--wish-soft)}
.group-head.wish .numeral{color:var(--wish)}
.group-head.etc .numeral{color:var(--etc)}
.group-head .numeral{font-family:var(--display);font-size:1.4rem}
.group-head.input .numeral{color:var(--in)}
.group-head.output .numeral{color:var(--out)}
.group-head p{margin:0;font-size:.88rem;color:var(--muted)}
.q-card{display:flex;flex-direction:row;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.q-card .bar2{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.q-card .bar2 span{display:block;height:100%;background:var(--accent)}
.q-info{font-size:.82rem;color:var(--muted)}
details.done-box summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:6px 0}
details.done-box .rows{margin-top:8px}

/* settings */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:.95rem}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.subchip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border-radius:999px;font-size:.88rem}
.subchip button{padding:0 6px;font-size:1rem;line-height:1;opacity:.7}

/* fab */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:60px;height:60px;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:6;display:grid;place-content:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-family:var(--display);font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:.82rem;color:var(--muted)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg.group button[data-v=input][aria-pressed="true"]{background:var(--in-soft);color:var(--in)}
.seg.group button[data-v=output][aria-pressed="true"]{background:var(--out-soft);color:var(--out)}
.seg.group button[data-v=etc][aria-pressed="true"]{background:var(--etc-soft);color:var(--etc)}
.seg.prio button[data-v="3"][aria-pressed="true"]{background:var(--warn-soft);color:var(--warn)}
.seg.prio button[data-v="2"][aria-pressed="true"]{background:var(--gold-soft);color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;font-size:.9rem}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;color:var(--muted)}
.quick button:hover{color:var(--fg);border-color:var(--muted)}
/* missions list + trophy cabinet */
.m-row{display:flex;align-items:center;gap:10px;padding:14px 12px 14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.m-row .m-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;text-align:left;padding:0;border-radius:8px}
.cabinet{background:var(--cabinet);border:1px solid var(--line);border-radius:16px;padding:16px 14px 10px;display:flex;flex-direction:column;gap:18px}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:end;padding:0 2px 10px;position:relative}
.shelf::after{content:"";position:absolute;left:-8px;right:-8px;bottom:0;height:9px;border-radius:3px;background:linear-gradient(var(--wood),var(--wood-dark));box-shadow:0 4px 6px rgba(0,0,0,.12)}
.trophy{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px 6px;text-align:center;min-width:0;border-radius:10px}
.trophy:hover{background:rgba(0,0,0,.04)}
.trophy svg{width:46px;height:54px;flex:none}
.trophy .tt{font-size:.78rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.trophy .td{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.trophy.ghost{opacity:.35;pointer-events:none}
.trophy.new svg{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4) translateY(10px);opacity:0}60%{transform:scale(1.15)}100%{transform:none;opacity:1}}
.badge-done{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--gold)}
.hero-trophy{display:flex;align-items:center;gap:14px}
.hero-trophy svg{width:56px;height:66px;flex:none}
/* component modules in the add sheet */
.kind-pill{font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle;margin-left:8px;font-family:var(--body)}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.mod-head{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 12px;border-bottom:1px solid var(--line)}
.mod-name{flex:1;font-weight:600;font-size:.9rem}
.mod-lock{font-size:.75rem;color:var(--muted)}
.mod-x{width:30px;height:30px;color:var(--muted);font-size:1.1rem;line-height:1;border-radius:8px}
.mod-x:hover{background:var(--line);color:var(--fg)}
.mod-body{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mod-body input,.mod-body select{background:var(--card)}
.add-mod{padding:11px;border:1.5px dashed var(--line);border-radius:12px;color:var(--accent);font-weight:600;width:100%}
.add-mod:hover{border-color:var(--accent)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pick b{font-size:.9rem}
.pick span{font-size:.75rem;color:var(--muted);line-height:1.35}
.pick:disabled{opacity:.5;cursor:not-allowed}
.filter-row{display:flex;gap:8px;align-items:center}
.filter-row select{flex:1}
.ghost-btn{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.88rem;color:var(--muted);white-space:nowrap;background:var(--card)}
.ghost-btn:hover{color:var(--fg);border-color:var(--muted)}

<script>
(function(){
"use strict";
/* ================= data ================= */
const APP_VERSION="v31";
const LS="checklist-v4", OLD=["todo-items-v3","todo-items-v1"];
const DAYS=["일","월","화","수","목","금","토"], ORDER=[1,2,3,4,5,6,0];
const GROUPS={input:"인풋",output:"아웃풋",etc:"기타"};
const GKEYS=["input","output","etc"];
const GDESC={input:"독서·공부·영화·액티비티처럼 경험하고 받아들이는 것",output:"그림·글쓰기처럼 직접 만들어 내는 것",etc:"장보기·청소처럼 자잘한 일"};
const PRIO={3:"높음",2:"보통",1:"낮음"};
const OLD_WISH_KINDS=["보고 싶은 것","하고 싶은 것","가고 싶은 곳","갖고 싶은 것"];
const WISH_KINDS=["영화","책","드라마","전시·공연","여행","맛집"];
const DEFAULT_ROUTINE={wake:"07:30",sleep:"23:30",gap:10,meals:[{n:"아침",s:"08:00",e:"08:30"},{n:"점심",s:"12:00",e:"13:00"},{n:"저녁",s:"18:30",e:"19:30"}]};
let S={taste:"",routine:JSON.parse(JSON.stringify(DEFAULT_ROUTINE)),catMeta:{},items:[],quests:[],missions:[],wishes:[],wishKinds:WISH_KINDS.slice(),subs:{input:["독서","공부","영화","시리즈","액티비티"],output:["그림","글쓰기","만들기"],etc:["생활","업무","약속"]}};
let homeLimit=8, homeMission="", homeTab="today", homeDay="";
try{const ht=localStorage.getItem("checklist-hometab");if(ht==="all"||ht==="mission"||ht==="today")homeTab=ht;}catch(e){}

const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

let loadFailed=false;
function load(){

  try{raw=localStorage.getItem(LS);if(!raw)for(const k of OLD){raw=localStorage.getItem(k);if(raw)break;}}catch(e){}

/* 자동 백업: 하루 한 번 이 기기 안에 사본을 남겨요 (최근 7일치) */
const SNAP="checklist-snapshots";
const countData=d=>d?((d.items||[]).length+(d.quests||[]).length+(d.wishes||[]).length+(d.missions||[]).length):0;
function snapshots(){try{return JSON.parse(localStorage.getItem(SNAP)||"[]");}catch(e){return [];}}
function takeSnapshot(){
  if(!countData(S))return;
  try{let list=snapshots();const cur=list.find(x=>x.day===today());if(cur&&countData(cur.data)>countData(S))return;list=list.filter(x=>x.day!==today());list.unshift({day:today(),at:Date.now(),data:{v:4,...S}});list=list.slice(0,7);localStorage.setItem(SNAP,JSON.stringify(list));}catch(e){}
}
let persisted=null;
if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{persisted=p;}).catch(()=>{});}
function merge(d){
  if(!d) return;
  if(Array.isArray(d.items)) S.items=d.items.map(i=>{
    const o={...i};
    if(o.group===undefined){const c=o.cat||"";delete o.cat;if(c==="영화"){o.group="input";o.sub="영화";}else if(c==="자기개발"){o.group="input";o.sub="공부";}else{o.group="etc";o.sub=c;}}
    if(!o.group)o.group="etc";
    if(!o.prio)o.prio=2; if(o.mission===undefined)o.mission="";
    if(o.done&&!o.doneAt)o.doneAt="";
    return o;
  });
  if(Array.isArray(d.quests)) S.quests=d.quests.map(q=>({mission:"",prio:2,...q,group:q.group||"etc",log:q.log||{}}));
  if(Array.isArray(d.missions)) S.missions=clone(d.missions);
  if(d.catMeta&&typeof d.catMeta==="object") S.catMeta=clone(d.catMeta);
  if(Array.isArray(d.wishes)) S.wishes=clone(d.wishes).map(w=>({...w,done:false}));
  if(Array.isArray(d.wishKinds)){
    const k=d.wishKinds.slice();
    if(k.length===OLD_WISH_KINDS.length&&k.every((x,i)=>x===OLD_WISH_KINDS[i])){ // 예전 기본 종류 → 새 세부 카테고리로
      S.wishKinds=WISH_KINDS.slice();
      S.wishes.forEach(w=>{if(w.kind&&!S.wishKinds.includes(w.kind))S.wishKinds.push(w.kind);});
    } else S.wishKinds=k;
  }
  if(d.subs&&d.subs.input&&d.subs.output){const def=S.subs.etc;S.subs=clone(d.subs);if(!S.subs.etc)S.subs.etc=def;}
  if(typeof d.taste==="string") S.taste=d.taste;
  if(d.sched&&typeof d.sched==="object") S.sched=clone(d.sched);
  if(d.routine&&d.routine.wake&&Array.isArray(d.routine.meals)) S.routine=clone(d.routine);
  if(d.tomb&&typeof d.tomb==="object") S.tomb=clone(d.tomb);
  if(d.setU) S.setU=d.setU;
}
let snapTaken=false;
function save(){

}

/* ================= 변경 기록 (동기화용) =================
   저장할 때마다 직전 상태와 비교해서, 바뀐 항목에는 수정 시각(u)을,
   지운 항목에는 삭제 기록(tomb)을 남겨요. 기기끼리 합칠 때 더 최근 것을 고르는 기준이 돼요. */
const COLLS=["items","quests","missions","wishes"];
let lastSeen=null;
const noU=o=>{const c={...o};delete c.u;return JSON.stringify(c);};
function seenMap(){
  const m={};COLLS.forEach(c=>(S[c]||[]).forEach(o=>{m[c+"/"+o.id]=noU(o);}));
  m.__set=JSON.stringify([S.subs,S.wishKinds,S.catMeta,S.routine,S.taste,S.sched||{}]);return m;
}
function stampChanges(){
  const now=Date.now();S.tomb=S.tomb||{};
  if(lastSeen){
    const cur={};
    COLLS.forEach(c=>(S[c]||[]).forEach(o=>{const k=c+"/"+o.id;cur[k]=1;if(lastSeen[k]!==noU(o))o.u=now;}));
    Object.keys(lastSeen).forEach(k=>{if(k!=="__set"&&!cur[k])S.tomb[k]=now;});
    if(lastSeen.__set!==JSON.stringify([S.subs,S.wishKinds,S.catMeta,S.routine,S.taste,S.sched||{}]))S.setU=now;
  }
  const old=now-90*86400000;Object.keys(S.tomb).forEach(k=>{if(S.tomb[k]<old)delete S.tomb[k];});
  lastSeen=seenMap();
}
const coreOf=x=>({sched:x.sched||{},taste:x.taste||"",routine:x.routine,items:x.items||[],quests:x.quests||[],missions:x.missions||[],wishes:x.wishes||[],subs:x.subs,wishKinds:x.wishKinds,catMeta:x.catMeta||{},tomb:x.tomb||{},setU:x.setU||0});
function mergeStates(L,R){
  const out=coreOf(L);const tomb={...(L.tomb||{})};
  Object.entries(R.tomb||{}).forEach(([k,t])=>{tomb[k]=Math.max(tomb[k]||0,t);});
  COLLS.forEach(c=>{
    const m=new Map();(L[c]||[]).forEach(o=>m.set(o.id,o));
    (R[c]||[]).forEach(o=>{const x=m.get(o.id);if(!x||(o.u||0)>(x.u||0))m.set(o.id,o);});
    out[c]=[...m.values()].filter(o=>!(tomb[c+"/"+o.id]&&tomb[c+"/"+o.id]>=(o.u||0)));
  });
  if((R.setU||0)>(L.setU||0)&&R.subs){out.subs=R.subs;out.wishKinds=R.wishKinds;out.catMeta=R.catMeta||{};if(R.routine)out.routine=R.routine;out.taste=R.taste||"";out.sched=R.sched||{};out.setU=R.setU;}
  out.tomb=tomb;return out;
}
const sameCore=(a,b)=>JSON.stringify(coreOf(a))===JSON.stringify(coreOf(b));

/* ================= 클라우드 동기화 (Firebase) ================= */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyB8qGSfzBK5fVnBq_rHmzaNLCoxa07zGus",
  authDomain:"todolist-a61b5.firebaseapp.com",
  projectId:"todolist-a61b5",
  storageBucket:"todolist-a61b5.firebasestorage.app",
  messagingSenderId:"787365340089",
  appId:"1:787365340089:web:6f4fdbd83c545649794c68"
};
const Sync={
  state:"loading", // loading | out | syncing | synced | offline | error | unavailable
  msg:"", user:null, lastAt:0, ready:false,
  _auth:null,_db:null,_unsub:null,_timer:null,_dirty:false,
  set(st,msg){this.state=st;this.msg=msg||"";paintSync();},
  loadSdk(){
    if(window.firebase&&window.firebase.firestore)return Promise.resolve();
    const one=src=>new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=src;sc.onload=ok;sc.onerror=()=>no(new Error("load"));document.head.appendChild(sc);});
    return one("vendor/firebase-app-compat.js").then(()=>Promise.all([one("vendor/firebase-auth-compat.js"),one("vendor/firebase-firestore-compat.js")]));
  },
  init(){
    this.loadSdk().then(()=>{
      const fb=window.firebase;if(!fb.apps.length)fb.initializeApp(FIREBASE_CONFIG);
      this._auth=fb.auth();this._db=fb.firestore();this.ready=true;
      this._auth.getRedirectResult().catch(e=>this.fail(e));
      this._auth.onAuthStateChanged(u=>{
        this.user=u;if(this._unsub){this._unsub();this._unsub=null;}
        if(!u){this.set("out");return;}
        this.set("syncing");this.listen();
      });
    }).catch(()=>this.set("unavailable","인터넷에 연결되면 동기화를 쓸 수 있어요."));
  },
  ref(){return this._db.doc("users/"+this.user.uid+"/state/main");},
  listen(){
    this._unsub=this.ref().onSnapshot({includeMetadataChanges:false},snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(!snap.exists){this.push(true);return;}
      let remote=null;try{remote=JSON.parse(snap.data().json||"{}");}catch(e){this.set("error","클라우드 데이터를 읽지 못했어요.");return;}
      const merged=mergeStates(S,remote);
      if(!sameCore(merged,S)){
        Object.assign(S,merged);lastSeen=seenMap();
        try{localStorage.setItem(LS,JSON.stringify({v:4,...S}));}catch(e){}
        render();
      }
      if(!sameCore(merged,remote))this.push(true);
      else{this.lastAt=Date.now();this.set("synced");}
    },e=>this.fail(e));
  },
  queue(){if(!this.user||!this.ready)return;this._dirty=true;clearTimeout(this._timer);this.set("syncing");this._timer=setTimeout(()=>this.push(),1200);},
  push(){
    if(!this.user)return;clearTimeout(this._timer);this._dirty=false;
    const json=JSON.stringify(coreOf(S));
    if(json.length>900000){this.set("error","데이터가 너무 커서 올리지 못했어요. 완료한 항목을 정리해 주세요.");return;}
    this.set("syncing");
    this.ref().set({json,at:Date.now(),v:APP_VERSION}).then(()=>{this.lastAt=Date.now();if(!this._dirty)this.set("synced");}).catch(e=>this.fail(e));
  },
  signIn(){
    if(!this.ready){toast("동기화 기능을 불러오는 중이에요. 잠시 후 다시 눌러 주세요.");return;}
    const p=new window.firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
    this._auth.signInWithPopup(p).then(()=>toast("로그인했어요. 데이터를 합치는 중이에요.")).catch(e=>{
      if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))return this._auth.signInWithRedirect(p).catch(x=>this.fail(x));
      if(e&&(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request"))return;
      this.fail(e);
    });
  },
  signOut(){if(this._auth)this._auth.signOut().then(()=>toast("로그아웃했어요. 이 기기의 데이터는 그대로 남아 있어요."));},
  fail(e){
    const c=(e&&e.code)||"";let m="동기화 중 문제가 생겼어요. 잠시 후 다시 시도해 주세요.";
    if(c.includes("unauthorized-domain"))m="Firebase 인증 설정의 승인된 도메인에 choo1014.github.io를 추가해 주세요.";
    else if(c.includes("permission-denied"))m="Firestore 보안 규칙이 막고 있어요. 규칙 탭의 내용을 확인해 주세요.";
    else if(c.includes("not-found")||c.includes("failed-precondition"))m="Firestore 데이터베이스가 아직 없어요. Firebase에서 데이터베이스를 만들어 주세요.";
    else if(c.includes("unavailable")||c.includes("network"))m="인터넷 연결이 없어 잠시 멈췄어요. 연결되면 다시 맞춰져요.";
    else if(c.includes("operation-not-allowed"))m="Firebase 인증에서 Google 로그인을 사용 설정해 주세요.";
    this.set(c.includes("unavailable")||c.includes("network")?"offline":"error",m);
    if(window.console)console.warn("sync",c,e&&e.message);
  }
};
window.addEventListener("online",()=>{if(Sync.user)Sync.push();});
function syncLabel(){
  return {loading:"동기화 준비 중",out:"로그인 안 함",syncing:"동기화 중…",synced:"동기화됨",offline:"오프라인",error:"동기화 오류",unavailable:"동기화 사용 불가"}[Sync.state]||"";
}
const ICON_CLOUD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>';

/* ================= quest math ================= */
function countSessions(days,start,span){let n=0;const d=parse(start);for(let i=0;i<span;i++){if(days.includes(d.getDay()))n++;d.setDate(d.getDate()+1);}return n;}
const doneBefore=(q,day)=>Object.keys(q.log||{}).filter(k=>q.log[k]&&k<day).length;
const doneTotal=q=>Object.keys(q.log||{}).filter(k=>q.log[k]).length;
function chunk(q,day){const p=q.plan,idx=doneBefore(q,day);const from=idx*p.per+1,to=Math.min(p.total,(idx+1)*p.per);return{idx,from,to,amt:to-from+1};}
const finished=q=>q.plan&&doneTotal(q)>=q.plan.sessions;
/* 분량 목표: 남은 분량을 남은 날로 매번 다시 나눠요 (밀리거나 앞서가도 자동 조정) */
const UNITS={page:{u:"쪽",verb:"읽었나요",did:"읽음",fin:"다 읽었어요!"},min:{u:"분",verb:"봤나요",did:"봄",fin:"다 봤어요!"},ep:{u:"화",verb:"봤나요",did:"봄",fin:"정주행 완료!"}};
const unitOf=q=>UNITS[(q.read&&q.read.unit)||"page"];
const tomorrowYmd=()=>{const d=new Date();d.setDate(d.getDate()+1);return ymd(d);};
const FORMATS={"시리즈":{unit:"ep",ph:"시리즈 제목 (예: 더 글로리)"},"독서":{unit:"page",ph:"책 제목 (예: 코스모스)"},"책":{unit:"page",ph:"책 제목"},"드라마":{unit:"ep",ph:"드라마 제목 (예: 더 글로리)"},"애니":{unit:"ep",ph:"애니 제목"},"영화":{once:true,time:120,ph:"영화 제목"}};
function readDaysFrom(q,from){
  const r=q.read;let n=0;const d=parse(from>r.start?from:r.start),e=parse(r.end);
  while(d<=e){if(q.days.includes(d.getDay()))n++;d.setDate(d.getDate()+1);}return n;
}
function readToday(q){
  const r=q.read,t=today(),h=r.hist&&r.hist[t];
  const base=h?h.from:r.cur, remain=Math.max(0,r.total-base), overdue=t>r.end;
  const left=overdue?1:Math.max(1,readDaysFrom(q,t));
  const per=Math.ceil(remain/left);
  return {base,target:Math.min(r.total,base+per),per,remain,overdue,left:overdue?0:readDaysFrom(q,t),logged:!!h};
}
function setReadPage(q,p){
  const r=q.read,t=today();r.hist=r.hist||{};
  const h=r.hist[t],base=h?h.from:r.cur,was=!!h;
  p=Math.max(0,Math.min(r.total,Math.round(p)));
  if(p>base){r.hist[t]={from:base,to:p};q.log[t]=true;}
  else {delete r.hist[t];delete q.log[t];}
  r.cur=p;
  if(!was&&q.log[t]&&q.mission)xpToast(q.mission,15);
  if(r.cur>=r.total&&base<r.total)toast(`『${q.title.replace(/[『』]/g,"")}』 ${unitOf(q).fin}`);
}
function questOnDay(q,t){
  if(q.hold) return false; // 홀드 중이면 어느 날에도 안 나와요
  const td=today(); if(!q.days.includes(parse(t).getDay())) return false;
  if(t<td) return !!(q.log&&q.log[t]); // 지난 날: 실제로 한 날만
  if(q.read){if(t<q.read.start)return false;const h=t===td&&q.read.hist&&q.read.hist[t];return (h?h.from:q.read.cur)<q.read.total;}
  if(q.start&&t<q.start) return false;
  if(q.end&&t>q.end) return false;
  if(q.plan&&t<q.plan.start) return false;
  if(q.plan&&doneBefore(q,t)>=q.plan.sessions) return false;
  return true;
}
const isTodayQuest=q=>questOnDay(q,today());
function nextDay(q){const d=new Date();for(let i=1;i<=7;i++){d.setDate(d.getDate()+1);if(q.days.includes(d.getDay()))return i===1?"내일":DAYS[d.getDay()]+"요일";}return "";}
const daysLeft=due=>due?Math.round((parse(due)-parse(today()))/86400000):Infinity;

/* ================= mission XP ================= */
// 할 일 만들기 +10 · 할 일 완료 +30 · 퀘스트 만들기 +10 · 퀘스트 1회 완료 +15
function missionStats(m){
  const its=S.items.filter(i=>i.mission===m.id), qs=S.quests.filter(q=>q.mission===m.id);
  const done=its.filter(i=>i.done).length, checks=qs.reduce((a,q)=>a+doneTotal(q),0);
  const xp=its.length*10+done*30+qs.length*10+checks*15;
  let lv=1,rest=xp,need=100;
  while(rest>=need){rest-=need;lv++;need=100+(lv-1)*50;}
  return {its,qs,made:its.length+qs.length,done,checks,xp,lv,rest,need};
}

const activeMissions=()=>S.missions.filter(m=>!m.done);

let freshTrophy="";
function completeMission(m){
  const s=missionStats(m);
  m.done=true;m.doneAt=today();m.trophy={lv:s.lv,xp:s.xp,made:s.made};
  freshTrophy=m.id;save();
  toast(`★ ${m.title} 달성! 트로피 진열장에 올렸어요`);
}
function reopenMission(m){m.done=false;delete m.doneAt;delete m.trophy;save();toast("다시 진행 중으로 옮겼어요.");}
function deleteMission(m){
  S.missions=S.missions.filter(x=>x.id!==m.id);
  [...S.items,...S.quests].forEach(x=>{if(x.mission===m.id)x.mission="";});
  save();toast("미션을 삭제했어요. 연결된 할 일은 남아 있어요.");
}
function armButton(btn,confirmText,fn){
  let armed=false;const orig=btn.textContent;
  btn.addEventListener("click",()=>{if(!armed){armed=true;btn.textContent=confirmText;setTimeout(()=>{armed=false;btn.textContent=orig;},3000);return;}fn();});
}

const ICON_PICKS=["book-open","graduation-cap","pencil","clapperboard","tv","film","popcorn","ticket","drama","music","footprints","dumbbell","bike","palette","brush","pen-line","hammer","code","camera","house","briefcase","handshake","plane","map-pin","tent","utensils","coffee","chef-hat","gamepad-2","shopping-bag","spray-can","languages","sprout","leaf","flower-2","trees","mountain","heart","star","moon","gift","dog","car","shirt","pill","wallet","piggy-bank","notebook-pen"];
function svgIcon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.pin}</svg>`;}
function hashHue(name){let h=0;for(const ch of name)h=(h*31+ch.codePointAt(0))>>>0;return h%10;}
function metaOf(sc,name){
  if(!name) return SCOPE_DEF[sc]||SCOPE_DEF.etc;
  const m=S.catMeta[sc+":"+name]||{};
  return {i:(m.i&&ICONS[m.i])?m.i:(ICON_OF[name]||(SCOPE_DEF[sc]||SCOPE_DEF.etc).i), c:m.c!=null?m.c:(HUE[name]!=null?HUE[name]:hashHue(name))};
}
function setMeta(sc,name,patch){const k=sc+":"+name;S.catMeta[k]={...(S.catMeta[k]||{}),...patch};save();}
const scopeOfItem=o=>o.kind!==undefined&&o.group===undefined?"wish":(o.group||"etc");
const catNameOf=o=>o.kind!==undefined&&o.group===undefined?o.kind:o.sub;
function catIco(o){const sc=scopeOfItem(o),m=metaOf(sc,catNameOf(o));const i=el("span","cat-ico hue"+m.c);i.innerHTML=svgIcon(m.i);i.setAttribute("aria-hidden","true");return i;}
const optLabel=(sc,name)=>name;
const SCOPE_NAME={input:"인풋",output:"아웃풋",etc:"기타",wish:"위시리스트"};
const catsOf=sc=>sc==="wish"?S.wishKinds:S.subs[sc];
function setCats(sc,arr){if(sc==="wish")S.wishKinds=arr;else S.subs[sc]=arr;}
const usersOf=(sc,name)=>sc==="wish"?S.wishes.filter(w=>w.kind===name):[...S.items,...S.quests].filter(o=>o.group===sc&&o.sub===name);
function removeCat(sc,name){
  setCats(sc,catsOf(sc).filter(k=>k!==name));
  delete S.catMeta[sc+":"+name];
  usersOf(sc,name).forEach(o=>{if(sc==="wish")o.kind="";else o.sub="";});
  if(sc==="wish"&&wishFilter===name)wishFilter="";
  if(sc!=="wish"&&groupFilter[sc]===name)groupFilter[sc]="";
  save();
}
function addCat(sc,name){name=name.trim();if(!name||catsOf(sc).includes(name))return false;catsOf(sc).push(name);save();return true;}

  sh.addEventListener("submit",e=>{e.preventDefault();const n=i.value.trim();if(!n){i.focus();return;}

/* ================= 스케쥴링 ================= */
const toMin=x=>{const[h,m]=String(x||"0:0").split(":").map(Number);return (h||0)*60+(m||0);};
const fmtMin=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");};
const fmtDur=m=>m>=60?(Math.floor(m/60)+"시간"+(m%60?" "+(m%60)+"분":"")):m+"분";
const nowMinutes=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
/* 스케쥴러에 넣을 때 기본 길이: '시간 배정'에 적은 분 → 분량 목표의 오늘 분량 → 30분 */
function durOf(o){
  if(o.dur) return o.dur;
  if(o.read){const r=o.read,ri=readToday(o),amt=Math.max(1,ri.target-ri.base);
    if(r.unit==="min")return Math.max(10,amt);
    if(r.unit==="ep")return Math.max(10,amt*(r.epMin||45));
    return Math.min(180,Math.max(15,Math.ceil(amt*2/5)*5));}
  return 30;
}
function itemByKey(k){const[c,id]=k.split("/");return (S[c]||[]).find(o=>o.id===id);}
function keyDone(k,d){const o=itemByKey(k);if(!o)return null;return k.startsWith("quests/")?!!o.log[d||today()]:!!o.done;}
/* 그 날 할 일: 그 요일의 반복 퀘스트 + 마감일이 그 날인 할 일 (오늘은 밀린 할 일도) */
function tasksFor(t){
  t=t||today();const td=today();
  const qs=S.quests.filter(q=>questOnDay(q,t)).map(q=>({key:"quests/"+q.id,title:q.title,o:q,done:!!q.log[t]}));
  const its=S.items.filter(i=>{
    if(!i.due)return false;
    if(t===td)return (i.due<=t&&!i.done)||(i.done&&i.doneAt===t&&i.due<=t);
    return i.due===t&&(!i.done||i.doneAt===t);
  }).map(i=>({key:"items/"+i.id,title:i.text,o:i,done:!!i.done}));
  return [...qs,...its];
}
const todayTasks=()=>tasksFor(today());
function schedDay(d){d=d||today();S.sched=S.sched||{};return (S.sched[d]||[]).filter(b=>itemByKey(b.key));}
function setSchedDay(arr,d){
  d=d||today();S.sched=S.sched||{};
  const before=new Map((S.sched[d]||[]).map(b=>[b.key,b]));
  arr.forEach(b=>{const o=before.get(b.key);if(!o||o.s!==b.s||o.e!==b.e)Cal.queue(d,b.key,"up");before.delete(b.key);});
  before.forEach((b,k)=>Cal.queue(d,k,"del"));
  if(arr.length)S.sched[d]=arr.map(b=>({key:b.key,s:b.s,e:b.e})).sort((a,b)=>a.s-b.s);else delete S.sched[d];
  // 지난 기록은 30일까지만 남겨요 (앞으로의 날짜는 그대로)
  const y=new Date();y.setDate(y.getDate()-30);const keep=ymd(y);
  Object.keys(S.sched).forEach(k=>{if(k<keep)delete S.sched[k];});
  save();paintCal(); // 구글 캘린더에는 '적용'을 눌러야 보내요
}
/* 오늘부터 앞으로 배치된 모든 일정을 캘린더 보낼 목록에 올려요 */
function queueAllUpcoming(x){const t=today();Object.keys(S.sched||{}).forEach(d=>{if(d>=t)schedDay(d).forEach(b=>{x[d+"|"+b.key]="up";});});return x;}

/* ================= 구글 캘린더 자동 등록 =================
   스케쥴러에 넣은 일정을 내 구글 캘린더에도 만들어서, 시작 시각에 캘린더 앱이 알려 줘요.
   일정 ID는 (날짜+할 일)로 정해져 있어서 여러 기기에서 넣어도 하나로 맞춰져요. */
const CAL_SCOPE="https://www.googleapis.com/auth/calendar.events";
const Cal={
  token:null,exp:0,busy:false,err:"",
  on(){try{return localStorage.getItem("checklist-cal")==="1";}catch(e){return false;}},
  setOn(v){try{localStorage.setItem("checklist-cal",v?"1":"0");}catch(e){}},
  calId(){try{return localStorage.getItem("checklist-calid")||"";}catch(e){return "";}},
  setCalId(v){try{if(v)localStorage.setItem("checklist-calid",v);else localStorage.removeItem("checklist-calid");}catch(e){}},
  remind(){try{const v=parseInt(localStorage.getItem("checklist-cal-remind"),10);return isNaN(v)?10:v;}catch(e){return 10;}},
  setRemind(v){try{localStorage.setItem("checklist-cal-remind",String(v));}catch(e){}},
  valid(){return !!this.token&&Date.now()<this.exp-60000;},
  q(){try{return JSON.parse(localStorage.getItem("checklist-cal-q")||"{}");}catch(e){return {};}},
  setQ(x){try{localStorage.setItem("checklist-cal-q",JSON.stringify(x));}catch(e){}},
  pending(){return Object.keys(this.q()).length;},
  queue(day,key,op){if(!this.on())return;const x=this.q();x[day+"|"+key]=op;this.setQ(x);},
  restore(){try{const t=JSON.parse(sessionStorage.getItem("checklist-caltok")||"null");if(t&&t.e>Date.now()){this.token=t.t;this.exp=t.e;}}catch(e){}},
  evId(day,key){
    const h=str=>{let x=0x811c9dc5;for(const ch of str){x^=ch.codePointAt(0);x=Math.imul(x,16777619)>>>0;}return x.toString(16).padStart(8,"0");};
    return "ck"+day.replace(/-/g,"")+h(key)+h(key.split("").reverse().join(""));
  },
  async connect(){ // 버튼을 눌렀을 때만 불러요 (구글 확인 창)
    if(!Sync.ready){toast("구글 로그인을 준비하는 중이에요. 잠시 후 다시 눌러 주세요.");return;}
    const p=new window.firebase.auth.GoogleAuthProvider();p.addScope(CAL_SCOPE);
    try{
      const u=Sync._auth.currentUser;
      const res=u?await u.reauthenticateWithPopup(p):await Sync._auth.signInWithPopup(p);
      const tok=res&&res.credential&&res.credential.accessToken;
      if(!tok)throw new Error("no-token");
      this.token=tok;this.exp=Date.now()+55*60000;this.err="";
      try{sessionStorage.setItem("checklist-caltok",JSON.stringify({t:tok,e:this.exp}));}catch(e){}
      if(!this.on()){this.setOn(true);this.setQ(queueAllUpcoming(this.q()));}
      toast("구글 캘린더와 연결했어요.");
      await this.flush();
      if(!this.err&&!this.pending()&&route()==="schedule")draftBegin(true);
    }catch(e){
      const c=(e&&e.code)||"";
      if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")return;
      this.err="구글 캘린더 연결에 실패했어요. 다시 눌러 주세요.";render();
      if(window.console)console.warn("cal",e);
    }
  },
  off(){this.setOn(false);this.setQ({});this.token=null;try{sessionStorage.removeItem("checklist-caltok");}catch(e){}render();toast("캘린더 연동을 껐어요. 이미 만든 일정은 캘린더에 남아 있어요.");},
  dt(day,min){const d=parse(day);d.setMinutes(min);const z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:00`;},
  async moveTo(v){
    // 예전 캘린더에 만든 오늘 일정은 지우고, 새 캘린더로 다시 만들어요
    if(!this.valid()){await this.connect();if(!this.valid())return;}
    const t=today();
    for(const d of Object.keys(S.sched||{}).filter(d=>d>=t))for(const b of schedDay(d)){try{await this.api("DELETE","/"+this.evId(d,b.key));}catch(e){}}
    this.setCalId(v);this.err="";this.setQ(queueAllUpcoming(this.q()));
    toast(v?"이제 이 캘린더로 보내요.":"기본 캘린더로 보내요.");await this.flush();
  },
  async api(method,path,body){
    const r=await fetch("https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(this.calId()||"primary")+"/events"+path,{method,headers:{Authorization:"Bearer "+this.token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
    if(r.status===401){this.token=null;throw Object.assign(new Error("auth"),{code:401});}
    if(r.status===404&&this.calId()&&!path){throw Object.assign(new Error("no-cal"),{code:"nocal"});}
    if(r.status===403){let t="";try{t=JSON.stringify(await r.json());}catch(e){}throw Object.assign(new Error(t),{code:403});}
    return r;
  },
  async apply(){ // '적용' 버튼: 쌓인 변경을 한 번에 보내요
    if(this.busy)return;
    if(!this.valid()){await this.connect();return;} // connect가 끝나면 바로 보내요
    const n=this.pending();await this.flush();
    if(!this.err&&!this.pending()){toast(n?`구글 캘린더에 ${n}개 반영했어요.`:"이미 모두 반영돼 있어요.");if(route()==="schedule")draftBegin(true);}
  },
  async flush(){
    if(!this.on()||!this.valid()||this.busy){paintCal();return;}
    this.busy=true;paintCal();
    const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||"Asia/Seoul";
    try{
      const x=this.q();
      for(const k of Object.keys(x)){
        const i=k.indexOf("|"),day=k.slice(0,i),key=k.slice(i+1),id=this.evId(day,key);
        const b=(S.sched&&S.sched[day]||[]).find(z=>z.key===key),it=itemByKey(key);
        if(x[k]==="del"||!b||!it){
          const r=await this.api("DELETE","/"+id);
          if(!(r.ok||r.status===404||r.status===410))throw new Error("del "+r.status);
        } else {
          const body={summary:(key.startsWith("quests/")?it.title:it.text),description:"체크리스트 스케쥴러에서 넣은 일정",
            start:{dateTime:this.dt(day,b.s),timeZone:tz},end:{dateTime:this.dt(day,b.e),timeZone:tz},
            reminders:{useDefault:false,overrides:[{method:"popup",minutes:this.remind()}]},status:"confirmed"};
          // 전용 캘린더가 있으면 그 캘린더 색(예: 유칼립투스)을 그대로 쓰고, 기본 캘린더면 가장 가까운 '세이지'로
          if(!this.calId())body.colorId="2";
          let r=await this.api("PUT","/"+id,body);
          if(r.status===404)r=await this.api("POST","",{id,...body});
          if(!r.ok)throw new Error("up "+r.status);
        }
        const y=this.q();delete y[k];this.setQ(y);
      }
      this.err="";
    }catch(e){
      if(e.code===401)this.err="";
      else if(e.code==="nocal")this.err="보낼 캘린더를 찾지 못했어요. 캘린더 ID를 확인해 주세요.";
      else if(e.code===403&&/accessNotConfigured|has not been used|disabled/i.test(e.message))this.err="Google Cloud 콘솔에서 'Google Calendar API'를 사용 설정해 주세요.";
      else if(e.code===403)this.err="캘린더 권한이 없어요. '다시 연결'을 눌러 캘린더 권한을 허용해 주세요.";
      else this.err="캘린더에 반영하지 못했어요. 인터넷 연결을 확인해 주세요.";
      if(window.console)console.warn("cal",e);
    }
    this.busy=false;paintCal();
  }
};
Cal.restore();
function calBar(){
  const w=el("div","cal-bar");w.id="calBar";fillCalBar(w);return w;
}
function fillCalBar(w){
  w.innerHTML="";const n=Cal.pending();
  const ic=el("span","cal-ic");ic.innerHTML=ICON_CAL;w.appendChild(ic);
  const tx=el("div","cal-tx");
  let btn=null;
  if(!Cal.on()){
    tx.append(el("b",null,"구글 캘린더에 등록"),el("span",null,"배치한 일정을 '적용'할 때 캘린더에도 만들어서, 일정 10분 전(설정에서 변경 가능)에 캘린더 앱이 알려 줘요."));
    btn=el("button","btn soft","연결");btn.addEventListener("click",()=>Cal.connect());
  } else if(Cal.busy){
    tx.append(el("b",null,"캘린더에 반영하는 중…"));
  } else if(Cal.err){
    tx.append(el("b",null,"캘린더 연동 문제"),el("span",null,Cal.err));
    btn=el("button","btn soft","다시 연결");btn.addEventListener("click",()=>Cal.connect());
  } else if(n){
    tx.append(el("b",null,`미등록 스케쥴 ${n}개`),el("span",null,"'적용'을 누르면 한 번에 보내요."+(Cal.valid()?"":" 구글 확인 창이 한 번 뜰 수 있어요.")));
    btn=el("button","btn","적용");btn.addEventListener("click",()=>Cal.apply());
  } else {
    tx.append(el("b",null,"구글 캘린더에 모두 반영됨"),el("span",null,(Cal.calId()?"전용 캘린더로 보내요. ":"기본 캘린더에 세이지 색으로 보내요. ")+"스케쥴을 바꾸면 아래에 뜨는 '적용'을 눌러 반영해요."));
  }
  w.appendChild(tx);if(btn){btn.type="button";w.appendChild(btn);}
  if(Cal.on()){
    // 알림 시점: 바꾸면 앞으로의 일정에 모두 다시 반영
    const rr=el("div","cal-remind");rr.appendChild(el("span",null,"알림"));
    const sel=el("select");sel.id="cal-remind";sel.setAttribute("aria-label","일정 알림 시점");
    [[0,"시작할 때"],[5,"5분 전"],[10,"10분 전"],[15,"15분 전"],[30,"30분 전"],[60,"1시간 전"]].forEach(([m,t])=>{const op=el("option",null,t);op.value=String(m);sel.appendChild(op);});
    sel.value=String(Cal.remind());

function sortTasks(arr){
  return arr.slice().sort((a,b)=>{
    const da=a._quest?0:daysLeft(a.due), db=b._quest?0:daysLeft(b.due);
    if(da!==db) return da-db;
    if((b.prio||2)!==(a.prio||2)) return (b.prio||2)-(a.prio||2);
    return (a.created||0)-(b.created||0);
  });
}

function questDoneAt(q){
  if(q.hold)return "";
  const last=ks=>{ks=ks.sort();return ks[ks.length-1]||"";};
  if(q.read){if(q.read.cur<q.read.total)return "";return last(Object.keys(q.read.hist||{}))||q.read.end||today();}
  if(q.plan){if(!finished(q))return "";return last(Object.keys(q.log||{}).filter(k=>q.log[k]))||today();}
  if(q.end&&q.end<today())return q.end;
  return "";
}
const isQuestDone=q=>!!questDoneAt(q);
function archiveOf(g){
  const its=S.items.filter(i=>i.group===g&&i.done).map(i=>({kind:"item",o:i,title:i.text,at:i.doneAt||i.due||"",sub:i.sub}));
  const qs=S.quests.filter(q=>q.group===g).map(q=>({q,at:questDoneAt(q)})).filter(x=>x.at).map(({q,at})=>({kind:"quest",o:q,title:q.title,at,sub:q.sub}));

/* 유리병 그리기: 끝낸 일 하나 = 알갱이 하나. 오래된 것부터 바닥에 차곡차곡 쌓여 지층이 돼요. */
function drawDust(cv,list,g,opts={}){
  const W=cv.clientWidth||300,H=cv.clientHeight||120,dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  const css=getComputedStyle(document.documentElement),cv_=n=>css.getPropertyValue(n).trim();
  const fg=hexRgb(cv_("--fg")),dark=(fg[0]+fg[1]+fg[2])>380;
  const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
  // 병 모양
  const jw=Math.min(W*.9,H*.78),bx=(W-jw)/2,neckW=jw*.5,nx=(W-neckW)/2;
  const top=H*.05,lipH=Math.max(4,H*.045),sh=H*.2,by=H*.24,bot=H-2,rad=jw*.22;
  const body=()=>{ctx.beginPath();ctx.moveTo(nx,top+lipH);ctx.lineTo(nx,sh);
    ctx.quadraticCurveTo(bx,sh,bx,by+rad*.4);ctx.lineTo(bx,bot-rad);ctx.quadraticCurveTo(bx,bot,bx+rad,bot);
    ctx.lineTo(bx+jw-rad,bot);ctx.quadraticCurveTo(bx+jw,bot,bx+jw,bot-rad);ctx.lineTo(bx+jw,by+rad*.4);
    ctx.quadraticCurveTo(bx+jw,sh,nx+neckW,sh);ctx.lineTo(nx+neckW,top+lipH);ctx.closePath();};
  const base=()=>{
    ctx.clearRect(0,0,W,H);
    // 바닥 그림자
    const sg=ctx.createRadialGradient(W/2,bot,2,W/2,bot,jw*.6);sg.addColorStop(0,rgba([0,0,0],dark?.35:.12));sg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=sg;ctx.fillRect(bx-jw*.2,bot-8,jw*1.4,12);

    gl.addColorStop(0,rgba(fg,dark?.07:.05));gl.addColorStop(.5,rgba(fg,dark?.02:.015));gl.addColorStop(1,rgba(fg,dark?.06:.045));
    ctx.fillStyle=gl;ctx.fill();
  };
  const glass=()=>{
    body();ctx.lineWidth=1.4;ctx.strokeStyle=rgba(fg,dark?.28:.22);ctx.stroke();

    const lw=neckW*1.14,lx=(W-lw)/2;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(lx,top,lw,lipH,lipH/2);else ctx.rect(lx,top,lw,lipH);
    ctx.fillStyle=rgba(fg,dark?.22:.16);ctx.fill();

    ctx.lineWidth=Math.max(1,jw*.012);ctx.beginPath();ctx.moveTo(hx+jw*.07,by+rad*.9);ctx.lineTo(hx+jw*.07,by+rad*1.9);ctx.stroke();
    ctx.restore();
  };
  // 알갱이 자리: 바닥부터 육각 배열로, 줄마다 가운데에서 바깥으로
  const n=list.length;
  let r=opts.r||Math.max(2.6,jw*(jw>150?.03:.048)),pos=[];
  for(let tries=0;tries<30;tries++){
    pos=[];const step=r*Math.sqrt(3),pad=r*.35+1.5;let row=0;
    while(pos.length<n){
      const y=bot-pad-r-row*step;if(y<by+r*.5)break;
      const dy=(bot-rad)-y,inset=dy<0?rad-Math.sqrt(Math.max(0,rad*rad-dy*dy)):0;
      const L=bx+pad+inset+r,R=bx+jw-pad-inset-r,off=(row%2)*r;
      const cells=[];for(let x=L+off;x<=R+.01;x+=2*r)cells.push(x);
      const mid=(L+R)/2;cells.sort((a,b)=>Math.abs(a-mid)-Math.abs(b-mid));
      for(const x of cells){if(pos.length>=n)break;pos.push([x,y]);}
      row++;
    }
    if(pos.length>=n)break;r*=.9;
  }
  const grain=(x,y,c,a)=>{
    ctx.globalAlpha=a==null?1:a;
    const gr=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
    gr.addColorStop(0,`rgb(${c.map(v=>Math.round(v+(255-v)*.55)).join(",")})`);gr.addColorStop(.55,`rgb(${c.join(",")})`);gr.addColorStop(1,`rgb(${c.map(v=>Math.round(v*.72)).join(",")})`);
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r*.94,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  };
  const cols=list.map(x=>hexRgb(cv_("--h"+metaOf(g,x.sub).c)));
  const seen=Math.min(opts.seen==null?n:opts.seen,pos.length);
  const paint=(t)=>{
    base();ctx.save();body();ctx.clip();
    let done=true;
    for(let i=0;i<pos.length;i++){
      if(i<seen||t==null){grain(pos[i][0],pos[i][1],cols[i]);continue;}
      const p=Math.min(1,Math.max(0,(t-(i-seen)*90)/700));if(p<1)done=false;if(p<=0)continue;
      const e=1-Math.pow(1-p,3),y0=sh-r;grain(pos[i][0],y0+(pos[i][1]-y0)*e,cols[i]);
    }
    ctx.restore();glass();
    if(!n&&opts.emptyText){ctx.fillStyle=rgba(fg,.45);ctx.font=`${Math.max(11,Math.min(13,jw*.08))}px sans-serif`;ctx.textAlign="center";ctx.fillText(opts.emptyText,W/2,(by+bot)/2+4);}

  paint(0);requestAnimationFrame(frame);
}

/* ================= 홀드: 진행도는 그대로 두고 잠시 멈추기 ================= */
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
const heldQuests=g=>S.quests.filter(q=>q.hold&&(!g||q.group===g));
const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
function holdQuest(q){
  const t=today();q.hold={at:t};
  // 앞으로 잡아 둔 스케쥴에서는 빼요
  const key="quests/"+q.id;
  Object.keys(S.sched||{}).filter(d=>d>=t).forEach(d=>{const arr=S.sched[d]||[];if(arr.some(b=>b.key===key))setSchedDay(arr.filter(b=>b.key!==key),d);});
  save();
}
/* 다시 시작: 멈춰 있던 날 수만큼 기간을 뒤로 밀어요 (남은 기간은 그대로) */
function resumeQuest(q){
  const h=q.hold;delete q.hold;if(!h){save();return "";}
  const t=today(),gap=Math.max(0,dayDiff(h.at,t));
  const sh=d=>{const x=parse(d);x.setDate(x.getDate()+gap);return ymd(x);};
  const fix=(o,sk,ek)=>{
    if(o[sk]&&o[sk]>h.at)o[sk]=sh(o[sk]);
    if(o[ek]){if(o[ek]>=h.at)o[ek]=sh(o[ek]);else o[ek]=shiftDay(t,7);}
  };
  if(q.read)fix(q.read,"start","end");
  else{fix(q,"start","end");if(q.plan&&q.plan.start>h.at)q.plan.start=sh(q.plan.start);}
  save();
  const e=q.read?q.read.end:q.end;if(!e)return "";const d=parse(e);return `${d.getMonth()+1}/${d.getDate()}`;
}
function holdProgress(q){
  if(q.read){const r=q.read,U=unitOf(q);return `${r.cur} / ${r.total}${U.u} (${Math.round(r.cur/r.total*100)}%)`;}
  if(q.plan)return `${Math.min(doneTotal(q),q.plan.sessions)} / ${q.plan.sessions}회`;
  return `${doneTotal(q)}회 했음`;
}

function route(){const h=location.hash.replace(/^#\/?/,"");return h||"home";}
function go(r,replace){if(replace){history.replaceState(null,"","#/"+r);lastRoute=r;render();}else location.hash="#/"+r;}
function setTitle(t){$("screenTitle").textContent=t;}
function render(){
  const r=route(), v=$("view"); const y=window.scrollY;
  v.innerHTML="";
  const home=r==="home";
  $("backBtn").hidden=home; $("backSpacer").hidden=true; $("syncBtn").hidden=!home;
  $("fab").hidden=r==="settings"||r==="schedule";
  if(home){setTitle("");screenHome(v);}
  else if(r==="missions"){setTitle("메인 미션");screenMissions(v);}
  else if(r.startsWith("mission/")){screenMission(v,r.slice(8));}
  else if(GKEYS.includes(r)){setTitle(GROUPS[r]);screenGroup(v,r);}
  else if(r.startsWith("done/")){screenDone(v,r.slice(5));}
  else if(r==="wish"){setTitle("위시리스트");screenWish(v);}
  else if(r==="hold"){screenHold(v);}
  else if(r==="schedule"){screenSchedule(v);}
  else if(r==="settings"){setTitle("설정");screenSettings(v);}
  else {go("home",true);return render();}
  window.scrollTo(0,y);paintCalPop();
}
