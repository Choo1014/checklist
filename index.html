/* ================= toast ================= */
let tt;
function toast(msg){let t=document.querySelector(".toast");if(!t){t=el("div","toast");t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=msg;clearTimeout(tt);tt=setTimeout(()=>t.remove(),2200);}
function xpToast(mid,n){const m=S.missions.find(x=>x.id===mid);if(m)toast(`★ ${m.title} +${n} XP`);}

/* ================= sheet (add / edit) ================= */
function closeSheet(){$("sheetRoot").innerHTML="";document.body.style.overflow="";}
function seg(cls,options,value,onChange){
  const s=el("div","seg "+cls);s.setAttribute("role","group");
  options.forEach(([v,l])=>{const b=el("button",null,l);b.type="button";b.dataset.v=v;b.setAttribute("aria-pressed",String(String(v)===String(value)));
    b.addEventListener("click",()=>{s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));onChange(v);});s.appendChild(b);});
  return s;
}
function field(label,control){const f=el("div","field");const l=el("span","lbl",label);f.append(l,control);return f;}

function openSheet(o){
  closeSheet();
  const root=$("sheetRoot");
  const scrim=el("div","scrim");scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet();});
  const sh=el("form","sheet");sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.autocomplete="off";
  scrim.appendChild(sh);root.appendChild(scrim);document.body.style.overflow="hidden";

  if(o.mode==="edit-mission"){
    const m=S.missions.find(x=>x.id===o.id);
    sh.appendChild(el("h3",null,"메인 미션"));
    const i=el("input");i.type="text";i.value=m.title;i.maxLength=60;i.id="missionTitle";
    sh.appendChild(field("이름",i));
    const br=el("div","btnrow");const sv=el("button","btn","저장");sv.type="submit";
    const del=el("button","btn danger","미션 삭제");del.type="button";
    armButton(del,"한 번 더 누르면 삭제돼요",()=>{deleteMission(m);closeSheet();go("missions",true);});
    br.append(sv,del);sh.appendChild(br);
    sh.addEventListener("submit",e=>{e.preventDefault();const t=i.value.trim();if(!t)return;m.title=t;save();closeSheet();render();});
    i.focus();return;
  }

  if(o.mode==="wish"||o.mode==="edit-wish"){wishSheet(sh,o);return;}
  if(o.mode==="cats"){catsSheet(sh,o);return;}
  if(o.mode==="log"){logSheet(sh,o);return;}
  if(o.mode==="sched-pick"){schedPickSheet(sh,o);return;}
  if(o.mode==="leave-sched"){
    const n=Cal.pending();
    sh.appendChild(el("h3",null,"적용하지 않은 스케쥴이 있어요"));
    sh.appendChild(el("p","hint",`구글 캘린더에 아직 보내지 않은 변경이 ${n}개 있어요. 그냥 나가면 이번에 바꾼 스케쥴은 취소되고 들어오기 전 상태로 돌아가요.`));
    const br=el("div","btnrow col");
    const ap=el("button","btn","적용하고 나가기");ap.type="button";
    ap.addEventListener("click",async()=>{closeSheet();await Cal.apply();if(!Cal.pending()&&!Cal.err){leaveOK=true;draftEnd();location.hash="#/"+o.to;}});
    const lv=el("button","btn danger","취소하고 나가기");lv.type="button";
    lv.addEventListener("click",()=>{closeSheet();draftRevert();leaveOK=true;location.hash="#/"+o.to;toast("바꾼 스케쥴을 취소했어요.");});
    const st=el("button","btn soft","계속 편집");st.type="button";st.addEventListener("click",()=>closeSheet());
    br.append(ap,lv,st);sh.appendChild(br);return;
  }
  if(o.mode==="sched-block"){schedBlockSheet(sh,o);return;}

  const editing=o.mode==="edit-task"||o.mode==="edit-quest";
  const isQuestEdit=o.mode==="edit-quest";
  const src=o.mode==="edit-task"?S.items.find(x=>x.id===o.id):isQuestEdit?S.quests.find(x=>x.id===o.id):null;
  const legacyPlan=!!(src&&src.plan);
  const st={
    group:src?(src.group||"etc"):(o.group||"input"),
    sub:src?(src.sub||""):(o.sub||""),
    prio:src?(src.prio||2):2,
    whenMode:isQuestEdit?"repeat":"once",
    days:src&&src.days?src.days.slice():[],
    unit:src&&src.read?(src.read.unit||"page"):"page",
    mods:new Set(),touched:false,auto:new Set()
  };
  const linkedMission=src?src.mission:(o.mission||"");
  if(src){
    if(isQuestEdit||src.due) st.mods.add("when");
    if(src.read) st.mods.add("amount");
    if(src.dur) st.mods.add("time");
    if(src.mission) st.mods.add("mission");
  } else if(o.mission&&S.missions.some(m=>m.id===o.mission&&!m.done)) st.mods.add("mission");
  const locked=new Set(isQuestEdit?["when"].concat(src.read?["amount"]:[]):[]);

  const h=el("h3",null,editing?(src.read?"분량 목표 수정":isQuestEdit?"반복 퀘스트 수정":"할 일 수정"):"새로 추가");
  const pill=el("span","kind-pill");h.appendChild(pill);sh.appendChild(h);

  const title=el("input");title.type="text";title.id="f-title";title.maxLength=200;title.placeholder="예: 『코스모스』 읽기";
  title.value=src?(src.text||src.title||""):(o.title||"");
  sh.appendChild(field("제목",title));

  sh.appendChild(field("큰 카테고리",seg("group",[["input","인풋"],["output","아웃풋"],["etc","기타"]],st.group,v=>{st.group=v;st.sub="";fillSubs();applyFormat();})));
  const sub=el("select");sub.id="f-sub";
  const newSub=el("input");newSub.type="text";newSub.id="f-newsub";newSub.placeholder="새 세부 카테고리 이름";newSub.maxLength=20;newSub.hidden=true;
  function fillSubs(){
    sub.innerHTML="";const add=(v,t)=>{const op=el("option",null,t);op.value=v;sub.appendChild(op);};
    add("","없음");const list=S.subs[st.group].slice();if(st.sub&&!list.includes(st.sub))list.push(st.sub);list.forEach(s=>add(s,optLabel(st.group,s)));add("__new","+ 새로 추가…");
    sub.value=st.sub;newSub.hidden=true;
  }
  sub.addEventListener("change",()=>{newSub.hidden=sub.value!=="__new";if(sub.value!=="__new"){st.sub=sub.value;applyFormat();}else newSub.focus();});
  newSub.addEventListener("change",()=>{const n=newSub.value.trim();if(n&&FORMATS[n]){st.sub=n;applyFormat();}});
  fillSubs();
  const subWrap=el("div","field");subWrap.append(el("span","lbl","세부 카테고리"),sub,newSub);
  const prioWrap=field("중요도",seg("prio",[["1","낮음"],["2","보통"],["3","높음"]],st.prio,v=>st.prio=+v));
  const two=el("div","two");two.append(subWrap,prioWrap);sh.appendChild(two);

  /* ---- 일정: 날짜 하나 / 반복 요일 ---- */
  const whenSeg=seg("when",[["once","날짜 하나"],["repeat","요일 반복"]],st.whenMode,v=>{st.whenMode=v;syncWhen();if(v==="once"&&st.mods.has("amount")){st.mods.delete("amount");renderMods();}else sync();});
  if(editing)whenSeg.querySelectorAll("button").forEach(b=>b.disabled=true);
  const due=el("input");due.type="date";due.id="f-due";due.value=src&&src.due?src.due:"";due.setAttribute("aria-label","날짜");
  const quick=el("div","quick");
  [["오늘",0],["내일",1],["이번 주말",-1]].forEach(([l,n])=>{const b=el("button",null,l);b.type="button";
    b.addEventListener("click",()=>{const d=new Date();if(n===-1){d.setDate(d.getDate()+((6-d.getDay()+7)%7));}else d.setDate(d.getDate()+n);due.value=ymd(d);});quick.appendChild(b);});
  const onceWrap=el("div","mod-sub");onceWrap.append(due,quick);
  const dayBox=el("div","days");
  const dErr=el("span","preview err","반복할 요일을 하나 이상 골라 주세요.");dErr.hidden=true;
  function paintDays(){dayBox.querySelectorAll("button").forEach((x,i)=>x.setAttribute("aria-pressed",String(st.days.includes(ORDER[i]))));}
  ORDER.forEach(d=>{const b=el("button",null,DAYS[d]);b.type="button";b.setAttribute("aria-label",DAYS[d]+"요일");b.disabled=legacyPlan;
    b.addEventListener("click",()=>{if(st.days.includes(d))st.days=st.days.filter(x=>x!==d);else st.days.push(d);paintDays();dErr.hidden=true;aPreview();});dayBox.appendChild(b);});
  paintDays();
  const dayQuick=el("div","quick");[["매일",[0,1,2,3,4,5,6]],["평일",[1,2,3,4,5]],["주말",[0,6]]].forEach(([l,ds])=>{const b=el("button",null,l);b.type="button";b.disabled=legacyPlan;
    b.addEventListener("click",()=>{st.days=ds.slice();paintDays();dErr.hidden=true;aPreview();});dayQuick.appendChild(b);});
  const rStart=el("input");rStart.type="date";rStart.id="f-rstart";rStart.setAttribute("aria-label","시작일");
  rStart.value=src&&src.read?src.read.start:(src&&src.start)||today();
  const rEnd=el("input");rEnd.type="date";rEnd.id="f-rend";rEnd.setAttribute("aria-label","종료일");
  rEnd.value=src&&src.read?src.read.end:(src&&src.end)||"";
  const dates=el("div","dates");dates.append(rStart,el("span",null,"~"),rEnd);
  const endQuick=el("div","quick");[["1주",7],["2주",14],["한 달",30],["두 달",60],["계속",0]].forEach(([l,n])=>{const b=el("button",null,l);b.type="button";
    b.addEventListener("click",()=>{if(!n){rEnd.value="";}else{const d=parse(rStart.value||today());d.setDate(d.getDate()+n-1);rEnd.value=ymd(d);}aPreview();});endQuick.appendChild(b);});
  [rStart,rEnd].forEach(x=>x.addEventListener("input",aPreview));
  const endLbl=el("span","lbl","기간 (시작 ~ 끝, 끝은 비워 두면 계속)");
  const repeatWrap=el("div","mod-sub");repeatWrap.append(dayBox,dayQuick,dErr,endLbl,dates,endQuick);
  if(legacyPlan)repeatWrap.appendChild(el("span","hint",`예전 '분량 나누기'로 만든 퀘스트예요 (${src.plan.total}${src.plan.unit}를 ${src.plan.sessions}회에). 요일은 바꿀 수 없어요.`));
  function syncWhen(){
    onceWrap.hidden=st.whenMode!=="once";repeatWrap.hidden=st.whenMode!=="repeat";
    endLbl.textContent=st.mods.has("amount")?"기간 (시작 ~ 목표일)":"기간 (시작 ~ 끝, 끝은 비워 두면 계속)";
    endQuick.lastChild.hidden=st.mods.has("amount");
  }
  const whenBody=[whenSeg,onceWrap,repeatWrap];

  /* ---- 분량 목표: 서적(쪽) / 영상(분) / 시리즈(화) ---- */
  const unitSeg=seg("unit",[["page","서적 · 쪽"],["min","영상 · 분"],["ep","시리즈 · 화"]],st.unit,v=>{st.unit=v;syncUnit();aPreview();});
  const aTotal=el("input");aTotal.type="number";aTotal.min="1";aTotal.inputMode="numeric";aTotal.id="f-atotal";aTotal.setAttribute("aria-label","총 분량");
  const aCur=el("input");aCur.type="number";aCur.min="0";aCur.inputMode="numeric";aCur.id="f-acur";aCur.setAttribute("aria-label","지금까지 한 분량");aCur.value="0";
  const aEp=el("input");aEp.type="number";aEp.min="1";aEp.inputMode="numeric";aEp.id="f-aep";aEp.setAttribute("aria-label","1화당 분");aEp.placeholder="45";
  if(src&&src.read){aTotal.value=src.read.total;aCur.value=src.read.cur;if(src.read.epMin)aEp.value=src.read.epMin;}
  const uT=el("span"),uC=el("span");
  const rowT=el("div","r");rowT.append(el("span",null,"총"),aTotal,uT);
  const rowE=el("div","r");rowE.append(el("span",null,"1화당 약"),aEp,el("span",null,"분"));
  const rowC=el("div","r");rowC.append(el("span",null,"지금까지"),aCur,uC);
  const lookQ=el("input");lookQ.type="search";lookQ.id="f-lookq";lookQ.maxLength=100;lookQ.placeholder="찾을 작품 제목 (예: 더 글로리)";lookQ.setAttribute("aria-label","찾을 작품 제목");
  let lookEdited=false;lookQ.addEventListener("input",()=>{lookEdited=true;});
  const syncLookQ=()=>{if(!lookEdited)lookQ.value=title.value.replace(/[『』「」<>《》"']/g," ").replace(/\s+(읽기|보기|정주행|완독)$/,"").trim();};
  title.addEventListener("input",syncLookQ);syncLookQ();
  const look=el("button","btn soft","찾기");look.type="button";
  const lookRow=el("div","look-in");lookRow.append(lookQ,look);
  const lookOut=el("div","look-out");
  const doLook=()=>{if(!lookQ.value.trim()){lookQ.focus();lookOut.innerHTML="";lookOut.appendChild(el("span","hint","찾을 제목을 적어 주세요."));return;}lookupAmount(lookQ.value,st.unit,lookOut,r=>{
    if(r.total)aTotal.value=r.total;if(r.epMin)aEp.value=r.epMin;aPreview();toast("분량을 채웠어요. 맞는지 확인해 주세요.");
  });};
  look.addEventListener("click",doLook);
  lookQ.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doLook();}});
  const aPv=el("div","preview");
  [aTotal,aCur,aEp].forEach(x=>x.addEventListener("input",aPreview));
  function syncUnit(){const u=UNITS[st.unit].u;uT.textContent=u;uC.textContent=u+(st.unit==="page"?"까지 읽음":"까지 봄");rowE.hidden=st.unit!=="ep";
    aTotal.placeholder=st.unit==="page"?"320":st.unit==="min"?"150":"16";}
  syncUnit();
  const amountBody=[unitSeg,el("span","lbl","인터넷에서 분량 찾기"),lookRow,lookOut,rowT,rowE,rowC,aPv];
  function aCalc(){
    const T=parseInt(aTotal.value,10),C=parseInt(aCur.value||"0",10)||0,a=rStart.value,b=rEnd.value,E=parseInt(aEp.value,10);
    if(!st.days.length) return {err:"일정에서 할 요일을 골라 주세요."};
    if(!a||!b) return {err:"일정에서 시작일과 목표일을 정해 주세요."};
    if(b<a) return {err:"목표일이 시작일보다 빨라요."};
    if(!(T>0)) return {err:"총 분량을 넣어 주세요."};
    if(C>=T) return {err:"이미 다 끝났어요. 지금까지 한 분량을 확인해 주세요."};
    if(st.unit==="ep"&&!(E>0)) return {err:"1화당 몇 분인지 넣어 주세요."};
    const fake={days:st.days,read:{start:a,end:b}};
    const n=readDaysFrom(fake,today()>a?today():a);
    if(!n) return {err:"남은 기간에 할 요일이 없어요. 목표일이나 요일을 바꿔 주세요."};
    return {T,C,a,b,n,E:st.unit==="ep"?E:undefined,per:Math.ceil((T-C)/n)};
  }
  function aPreview(){
    if(!st.mods.has("amount"))return;const c=aCalc(),u=UNITS[st.unit].u;
    if(c.err){aPv.textContent=c.err;aPv.classList.add("err");return;}
    aPv.classList.remove("err");
    aPv.textContent=`할 날 ${c.n}일 · 하루 약 ${c.per}${u}`+(st.unit==="ep"?` (약 ${fmtDur(c.per*c.E)})`:"")+` · 남은 ${c.T-c.C}${u}`;
  }

  /* ---- 시간 배정 (분) ---- */
  const tMin=el("input");tMin.type="number";tMin.min="5";tMin.max="720";tMin.inputMode="numeric";tMin.id="f-tmin";tMin.placeholder="30";tMin.setAttribute("aria-label","소요 시간(분)");
  if(src&&src.dur)tMin.value=src.dur;
  const tRow=el("div","r");tRow.append(tMin,el("span",null,"분"));
  const tQuick=el("div","quick");[15,30,45,60,90,120].forEach(n=>{const b=el("button",null,fmtDur(n));b.type="button";b.addEventListener("click",()=>tMin.value=String(n));tQuick.appendChild(b);});
  const timeBody=[tRow,tQuick,el("span","hint","스케쥴러에 넣을 때 이 길이로 들어가요.")];

  const mis=el("select");mis.id="f-mission";mis.setAttribute("aria-label","메인 미션");
  activeMissions().forEach(m=>{const op=el("option",null,"★ "+m.title);op.value=m.id;mis.appendChild(op);});
  if(linkedMission){const lm=S.missions.find(m=>m.id===linkedMission);if(lm&&lm.done){const op=el("option",null,"★ "+lm.title+" (달성)");op.value=lm.id;mis.appendChild(op);}}
  if(linkedMission)mis.value=linkedMission;
  const missionBody=[mis,el("span","hint","만들면 +10, 완료할 때마다 경험치가 쌓여요.")];

  const MODS={
    when:{name:"일정",desc:"날짜 하나, 또는 요일마다 반복",body:whenBody},
    amount:{name:"분량 목표",desc:"책은 쪽, 영상은 분, 시리즈는 화로 하루 분량을 계산",body:amountBody},
    time:{name:"시간 배정",desc:"걸리는 시간(분)을 정해 스케쥴러에 써요",body:timeBody},
    mission:{name:"메인 미션 연결",desc:"완료할 때마다 미션 경험치가 쌓여요",body:missionBody}
  };
  const MORDER=["when","amount","time","mission"];
  function availability(k){ // false = hide, string = disabled reason, null = ok
    if(st.mods.has(k)) return false;
    if(k==="amount"&&(o.mode==="edit-task"||legacyPlan)) return false;
    if(k==="mission"&&!mis.options.length) return "메인 미션을 먼저 만들어 주세요";
    return null;
  }
  function addMod(k){
    st.mods.add(k);
    if(k==="amount"){
      if(!st.mods.has("when"))st.mods.add("when");
      if(st.whenMode!=="repeat"){st.whenMode="repeat";whenSeg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v==="repeat")));}
      if(!st.days.length){st.days=[0,1,2,3,4,5,6];paintDays();}
      if(!rEnd.value){const d=parse(rStart.value||today());d.setDate(d.getDate()+13);rEnd.value=ymd(d);}
    }
  }

  sh.appendChild(el("span","lbl","기능"));
  const modsBox=el("div","mods");sh.appendChild(modsBox);
  const addBtn=el("button","add-mod","+ 기능 추가");addBtn.type="button";
  const picker=el("div","picker");picker.hidden=true;
  sh.append(addBtn,picker);
  addBtn.addEventListener("click",()=>{picker.hidden=!picker.hidden;renderPicker();});

  function renderMods(){
    modsBox.innerHTML="";
    MORDER.filter(k=>st.mods.has(k)).forEach(k=>{
      const card=el("div","mod");const head=el("div","mod-head");
      head.appendChild(el("span","mod-name",MODS[k].name));
      if(st.auto.has(k)&&!st.touched)head.appendChild(el("span","mod-lock",st.sub+" 기본"));
      if(locked.has(k)) head.appendChild(el("span","mod-lock","고정"));
      else {const x=el("button","mod-x","×");x.type="button";x.setAttribute("aria-label",MODS[k].name+" 빼기");
        x.addEventListener("click",()=>{st.touched=true;st.mods.delete(k);if(k==="when")st.mods.delete("amount");if(k==="when")due.value="";renderMods();});head.appendChild(x);}
      const body=el("div","mod-body");MODS[k].body.forEach(n=>body.appendChild(n));
      card.append(head,body);modsBox.appendChild(card);
    });
    const any=MORDER.some(k=>availability(k)!==false);
    addBtn.hidden=!any;if(!any)picker.hidden=true;
    renderPicker();syncWhen();sync();
  }
  function renderPicker(){
    if(picker.hidden) return;
    picker.innerHTML="";
    MORDER.forEach(k=>{
      const a=availability(k);if(a===false)return;
      const p=el("button","pick");p.type="button";p.append(el("b",null,"+ "+MODS[k].name),el("span",null,a||MODS[k].desc));
      p.disabled=!!a;
      p.addEventListener("click",()=>{st.touched=true;addMod(k);picker.hidden=true;renderMods();});
      picker.appendChild(p);
    });
  }
  /* 세부 카테고리에 맞춘 기본 포맷 (새로 만들 때, 직접 기능을 고치기 전까지만) */
  function applyFormat(){
    if(editing||st.touched)return;
    st.auto.forEach(k=>st.mods.delete(k));st.auto.clear();
    const f=FORMATS[st.sub];
    if(f){
      if(f.unit){st.unit=f.unit;unitSeg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===f.unit)));syncUnit();["when","amount"].forEach(k=>{if(!st.mods.has(k)){addMod(k);st.auto.add(k);}});}
      if(f.once&&!st.mods.has("when")){st.mods.add("when");st.auto.add("when");st.whenMode="once";whenSeg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v==="once")));if(!due.value)due.value=today();}
      if(f.time&&!st.mods.has("time")){st.mods.add("time");st.auto.add("time");if(!tMin.value)tMin.value=String(f.time);}
      if(f.ph)title.placeholder=f.ph;
    }
    renderMods();
  }
  const isQuest=()=>st.mods.has("when")&&st.whenMode==="repeat";
  function sync(){
    pill.textContent=st.mods.has("amount")?"분량 목표":isQuest()?"반복 퀘스트":"할 일";
    save1.textContent=editing?"저장":(st.mods.has("amount")?"분량 목표 추가":isQuest()?"반복 퀘스트 추가":"할 일 추가");
    aPreview();
  }

  const br=el("div","btnrow");const save1=el("button","btn");save1.type="submit";br.appendChild(save1);
  if(editing){
    const del=el("button","btn danger","삭제");del.type="button";
    armButton(del,"한 번 더 누르면 삭제",()=>{
      if(isQuestEdit)S.quests=S.quests.filter(x=>x.id!==src.id);else S.items=S.items.filter(x=>x.id!==src.id);
      save();closeSheet();render();toast("삭제했어요.");});
    if(isQuestEdit)br.appendChild(holdButton(src));
    br.appendChild(del);
  }
  sh.appendChild(br);
  renderMods();
  if(!editing&&st.sub)applyFormat();

  sh.addEventListener("submit",e=>{
    e.preventDefault();
    const t=title.value.trim();if(!t){title.focus();return;}
    if(sub.value==="__new"){const n=newSub.value.trim();if(!n){newSub.focus();return;}if(!S.subs[st.group].includes(n))S.subs[st.group].push(n);st.sub=n;}
    const mission=st.mods.has("mission")?mis.value:"";
    const newLink=mission&&mission!==(src?src.mission:"");
    const dur=st.mods.has("time")?(parseInt(tMin.value,10)||0):0;
    if(st.mods.has("time")&&!(dur>0)){tMin.focus();return;}
    let ad=null;
    if(st.mods.has("amount")){const c=aCalc();if(c.err){aPv.textContent=c.err;aPv.classList.add("err");aPv.scrollIntoView({block:"center"});return;}ad=c;}
    if(isQuest()&&!st.days.length){dErr.hidden=false;dayBox.scrollIntoView({block:"center"});return;}
    const base={group:st.group,sub:st.sub,mission,prio:st.prio};
    const setDur=x=>{if(dur)x.dur=dur;else delete x.dur;delete x.diff;};
    if(editing){
      Object.assign(src,base);setDur(src);
      if(isQuestEdit){
        src.title=t;
        if(!legacyPlan)src.days=st.days.slice();
        if(ad){src.read=Object.assign(src.read||{hist:{}},{unit:st.unit,total:ad.T,cur:ad.C,start:ad.a,end:ad.b});if(ad.E)src.read.epMin=ad.E;else delete src.read.epMin;delete src.start;delete src.end;}
        else if(!legacyPlan){src.start=rStart.value||"";if(rEnd.value)src.end=rEnd.value;else delete src.end;}
      } else {src.text=t;src.due=st.mods.has("when")?(due.value||""):"";}
      save();closeSheet();render();toast(newLink?"저장했어요. 미션 경험치 +10":"저장했어요.");return;
    }
    const now=Date.now();
    if(ad){
      const q={id:uid(),title:t,...base,days:st.days.slice(),plan:null,read:{unit:st.unit,total:ad.T,cur:ad.C,start:ad.a,end:ad.b,hist:{}},log:{},created:now};
      if(ad.E)q.read.epMin=ad.E;setDur(q);S.quests.push(q);
    } else if(isQuest()){
      const q={id:uid(),title:t,...base,days:st.days.slice(),plan:null,log:{},created:now,start:rStart.value||today()};
      if(rEnd.value)q.end=rEnd.value;setDur(q);S.quests.push(q);
    } else {
      const it={id:uid(),text:t,done:false,doneAt:"",...base,due:st.mods.has("when")?(due.value||""):"",created:now};setDur(it);S.items.push(it);
    }
    if(o.fromWish){S.wishes=S.wishes.filter(w=>w.id!==o.fromWish);}
    save();closeSheet();render();
    if(o.fromWish)toast("위시를 할 일로 옮겼어요.");else if(mission)xpToast(mission,10);else toast("추가했어요.");
  });
  if(!editing) setTimeout(()=>title.focus(),50);
}

/* ---- 분량 기록: 오늘 한 만큼 입력 → 게이지 미리보기 → 등록 ---- */
function logSheet(sh,o){
  const q=S.quests.find(x=>x.id===o.id);if(!q||!q.read){closeSheet();return;}
  const r=q.read,U=unitOf(q),ri=readToday(q),isMin=r.unit==="min";
  const per=Math.max(0,ri.target-ri.base);
  const show=n=>isMin?(n>=60?`${Math.floor(n/60)}시간`+(n%60?` ${n%60}분`:""):`${n}분`):`${n}${U.u}`;
  sh.appendChild(el("h3",null,q.title));
  const stat=el("div","read-stat");
  [[`${r.cur}/${r.total}`,"지금까지"],[`${r.total-r.cur}${U.u}`,"남은 분량"],[ri.overdue?"지남":`${ri.left}일`,"남은 날"]].forEach(([b,l])=>{const d=el("div");d.append(el("b",null,b),el("span",null,l));stat.appendChild(d);});
  sh.appendChild(stat);
  sh.appendChild(el("span","hint",r.cur>=r.total&&!ri.logged?"이미 다 끝났어요.":ri.overdue?`목표일이 지났어요. 끝(${show(r.total)})까지를 오늘 목표로 잡았어요.`:`오늘 목표는 ${show(ri.target)}까지예요 (${per}${U.u}`+(r.unit==="ep"&&r.epMin?`, 약 ${fmtDur(per*r.epMin)}`:"")+"). 더 하거나 덜 해도 남은 날에 맞춰 다시 계산해요."));
  const pin=el("div","page-in");const inp=el("input");
  inp.type="number";inp.min="0";inp.inputMode="numeric";inp.id="log-pos";
  // 영상은 '시간'과 '분' 칸을 따로 둬요
  const inH=el("input");inH.type="number";inH.min="0";inH.inputMode="numeric";inH.id="log-h";inH.setAttribute("aria-label","시간");
  if(isMin){
    inp.max="59";inp.setAttribute("aria-label","분");inp.placeholder=String(ri.target%60);inH.placeholder=String(Math.floor(ri.target/60));
    if(ri.logged){inH.value=String(Math.floor(r.cur/60));inp.value=String(r.cur%60);}
    pin.classList.add("hm");pin.append(inH,el("span",null,"시간"),inp,el("span",null,"분까지"));
  } else {
    inp.max=String(r.total);inp.placeholder=String(ri.target);inp.value=ri.logged?String(r.cur):"";inp.setAttribute("aria-label",`지금 몇 ${U.u}까지`);
    pin.append(inp,el("span",null,`${U.u}까지 / ${r.total}${U.u}`));
  }
  sh.appendChild(field(isMin?"지금 몇 시간 몇 분까지 봤나요?":`지금 몇 ${U.u}까지 ${U.verb}?`,pin));
  const g=el("div","gauge "+"hue"+metaOf(q.group,q.sub).c);
  const gDone=el("span","g-done"),gToday=el("span","g-today"),gMark=el("span","g-mark");
  g.append(gDone,gToday,gMark);sh.appendChild(g);
  const gTxt=el("div","preview");sh.appendChild(gTxt);
  const pct=x=>Math.max(0,Math.min(100,x/r.total*100))+"%";
  gMark.style.left=pct(ri.target);
  // "85", "1:25", "1시간 25분" 모두 받아요 (영상은 분)
  function parsePos(){
    if(isMin){const h=inH.value.trim(),m=inp.value.trim();if(h===""&&m==="")return null;return (parseInt(h||"0",10)||0)*60+(parseInt(m||"0",10)||0);}
    const raw=inp.value.trim();if(raw==="")return null;const n=parseInt(raw,10);return isNaN(n)?null:n;
  }
  function upd(){
    const p=parsePos();
    gDone.style.width=pct(Math.min(ri.base,p==null?ri.base:p));
    if(p==null){gToday.style.width="0";g.classList.remove("ok","short");gTxt.classList.remove("err");gTxt.textContent=`오늘 목표 ${show(ri.target)}까지 · 숫자를 넣으면 미리 보여 드려요`;return;}
    const pos=Math.min(r.total,p),v=pos-ri.base;
    gToday.style.left=pct(ri.base);gToday.style.width=pct(Math.max(0,v));
    const ok=pos>=ri.target&&v>0;g.classList.toggle("ok",ok);g.classList.toggle("short",!ok&&v>0);
    gTxt.classList.toggle("err",p>r.total);
    if(p>r.total){gTxt.textContent=`전체가 ${show(r.total)}이에요. 끝까지 본 걸로 기록할게요.`;}
    if(v<=0){gTxt.textContent=v<0?`어제까지 기록(${show(ri.base)})보다 앞이에요. ${show(pos)}로 고쳐서 기록할게요.`:`오늘 기록이 없어요 (지금까지 ${show(ri.base)})`;return;}
    const left=r.total-pos;
    if(left<=0){gTxt.textContent=`오늘 ${v}${U.u} · ${U.fin}`;return;}
    const nd=readDaysFrom(q,tomorrowYmd()),next=nd?Math.ceil(left/nd):left,diff=pos-ri.target;
    gTxt.textContent=`오늘 ${v}${U.u} · `+(diff>=0?(diff?`목표보다 ${diff}${U.u} 더 했어요`:"목표를 채웠어요"):`목표까지 ${-diff}${U.u} 모자라요`)+
      (nd?` · 남은 ${nd}일 동안 하루 약 ${next}${U.u}`:` · 남은 ${left}${U.u}`)+(nd&&next!==per?(next>per?" (늘어나요)":" (줄어요)"):"");
  }
  inp.addEventListener("input",upd);inH.addEventListener("input",upd);upd();
  const qk=el("div","quick");[[`목표 ${show(ri.target)}`,ri.target],["끝까지",r.total]].forEach(([l,v])=>{const b=el("button",null,l);b.type="button";
    b.addEventListener("click",()=>{if(isMin){inH.value=String(Math.floor(v/60));inp.value=String(v%60);}else inp.value=String(v);upd();});qk.appendChild(b);});
  sh.appendChild(qk);
  const br=el("div","btnrow");const sv=el("button","btn","등록");sv.type="submit";br.appendChild(sv);
  if(ri.logged){const cl=el("button","btn soft","오늘 기록 지우기");cl.type="button";cl.addEventListener("click",()=>{setReadPage(q,ri.base);save();closeSheet();render();toast("오늘 기록을 지웠어요.");});br.appendChild(cl);}
  const ed=el("button","btn soft","계획 수정");ed.type="button";ed.addEventListener("click",()=>openSheet({mode:"edit-quest",id:q.id}));br.appendChild(ed);
  br.appendChild(holdButton(q));
  sh.appendChild(br);
  sh.addEventListener("submit",e=>{e.preventDefault();const p=parsePos();if(p==null){(isMin?inH:inp).focus();return;}
    const pos=Math.min(r.total,p);setReadPage(q,pos);save();closeSheet();render();
    if(q.read.cur<q.read.total)toast(`${show(pos)}까지 기록했어요.`);});
  setTimeout(()=>(isMin?inH:inp).focus(),50);
}

/* ---- 인터넷에서 분량 찾기 (키 없이 쓰는 공개 자료) ---- */
async function getJSON(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||9000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json();}finally{clearTimeout(t);}}
const wdNum=(cl,p)=>{try{return parseFloat(cl[p][0].mainsnak.datavalue.value.amount);}catch(e){return NaN;}};
const wdUnit=(cl,p)=>{try{return cl[p][0].mainsnak.datavalue.value.unit||"";}catch(e){return "";}};
function wdMinutes(cl){const v=wdNum(cl,"P2047");if(!(v>0))return 0;const u=wdUnit(cl,"P2047");if(u.endsWith("Q11574"))return Math.round(v/60);if(u.endsWith("Q25235"))return Math.round(v*60);return Math.round(v);}
async function lookWikidata(q){
  const s=await getJSON(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(q)}&language=ko&uselang=ko&type=item&limit=6&format=json&origin=*`);
  const ids=(s.search||[]).map(x=>x.id);if(!ids.length)return [];
  const g=await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${ids.join("|")}&props=claims|labels|descriptions&languages=ko|en&format=json&origin=*`);
  return ids.map(id=>{const e=g.entities[id];if(!e)return null;const cl=e.claims||{};
    const lab=(e.labels.ko||e.labels.en||{}).value||id,desc=(e.descriptions.ko||e.descriptions.en||{}).value||"";
    return {name:lab,desc,eps:wdNum(cl,"P1113")||0,min:wdMinutes(cl),pages:wdNum(cl,"P1104")||0,src:"위키데이터"};}).filter(Boolean);
}
async function lookJikan(q){
  const s=await getJSON(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=4&sfw=true`);
  return (s.data||[]).map(a=>{let m=0;const d=String(a.duration||"");const h=d.match(/(\d+)\s*hr/),mm=d.match(/(\d+)\s*min/);m=(h?+h[1]*60:0)+(mm?+mm[1]:0);
    return {name:a.title_japanese&&a.title?`${a.title}`:(a.title||""),desc:[a.type,a.year].filter(Boolean).join(" · "),eps:a.episodes||0,min:m,src:"MyAnimeList"};});
}
async function lookTvmaze(q){
  const s=await getJSON(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
  const top=(s||[]).slice(0,3);
  return Promise.all(top.map(async x=>{const sh=x.show;let eps=0;try{const e=await getJSON(`https://api.tvmaze.com/shows/${sh.id}/episodes`,7000);eps=e.length;}catch(err){}
    return {name:sh.name,desc:[sh.language,sh.premiered&&sh.premiered.slice(0,4)].filter(Boolean).join(" · "),eps,min:sh.averageRuntime||sh.runtime||0,src:"TVmaze"};}));
}
async function lookBooks(q){
  const s=await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=8&printType=books`);
  return (s.items||[]).map(i=>i.volumeInfo||{}).filter(v=>v.pageCount>0).slice(0,6).map(v=>({name:v.title+(v.subtitle?": "+v.subtitle:""),desc:[(v.authors||[]).join(", "),v.publisher,(v.publishedDate||"").slice(0,4)].filter(Boolean).join(" · "),pages:v.pageCount,src:"Google 도서"}));
}
async function lookupAmount(rawTitle,unit,out,apply){
  const q=String(rawTitle||"").replace(/[『』「」<>《》"']/g," ").replace(/\s+(읽기|보기|정주행|완독)$/,"").trim();
  out.innerHTML="";
  if(!q){out.appendChild(el("span","hint","찾을 제목을 적어 주세요."));return;}
  out.appendChild(el("span","hint",`'${q}' 찾는 중…`));
  const jobs=unit==="page"?[lookBooks(q),lookWikidata(q)]:unit==="ep"?[lookWikidata(q),lookJikan(q),lookTvmaze(q)]:[lookWikidata(q),lookTvmaze(q)];
  const res=(await Promise.all(jobs.map(p=>p.catch(()=>[])))).flat();
  const good=res.filter(r=>unit==="page"?r.pages>0:unit==="ep"?r.eps>0:r.min>0).slice(0,6);
  out.innerHTML="";
  if(!good.length){out.appendChild(el("span","hint","찾지 못했어요. 제목을 바꿔 보거나 직접 입력해 주세요."));return;}
  out.appendChild(el("span","hint","맞는 것을 고르면 분량을 채워요."));
  good.forEach(r=>{
    const b=el("button","look-row");b.type="button";
    const val=unit==="page"?`${r.pages}쪽`:unit==="ep"?`${r.eps}화`+(r.min?` · 1화 ${r.min}분`:""):`${r.min}분`;
    b.append(el("b",null,r.name),el("span",null,[r.desc,r.src].filter(Boolean).join(" · ")),el("em",null,val));
    b.addEventListener("click",()=>{apply(unit==="page"?{total:r.pages}:unit==="ep"?{total:r.eps,epMin:r.min||undefined}:{total:r.min});out.innerHTML="";});
    out.appendChild(b);
  });
}

function wishSheet(sh,o){
  const w=o.mode==="edit-wish"?S.wishes.find(x=>x.id===o.id):null;
  sh.appendChild(el("h3",null,w?"위시 수정":"위시리스트에 담기"));
  const text=el("input");text.type="text";text.id="w-text";text.maxLength=120;text.placeholder="예: 『듄: 파트 2』 보기";text.value=w?w.text:"";
  sh.appendChild(field("무엇을",text));
  const kind=el("select");kind.id="w-kind";
  const newK=el("input");newK.type="text";newK.id="w-newkind";newK.maxLength=20;newK.placeholder="새 세부 카테고리 이름 (예: 애니)";newK.hidden=true;
  const add=(v,t)=>{const op=el("option",null,t);op.value=v;kind.appendChild(op);};
  add("","없음");const kinds=S.wishKinds.slice();if(w&&w.kind&&!kinds.includes(w.kind))kinds.push(w.kind);kinds.forEach(k=>add(k,optLabel("wish",k)));add("__new","+ 새로 추가…");
  kind.value=w?(w.kind||""):(o.kind&&o.kind!=="__none"?o.kind:"");
  kind.addEventListener("change",()=>{newK.hidden=kind.value!=="__new";if(!newK.hidden)newK.focus();});
  const kf=el("div","field");kf.append(el("span","lbl","세부 카테고리"),kind,newK);sh.appendChild(kf);
  const memo=el("textarea");memo.id="w-memo";memo.rows=2;memo.maxLength=300;memo.placeholder="메모 (예: 친구 추천, 넷플릭스에 있음)";memo.value=w?(w.memo||""):"";
  sh.appendChild(field("메모",memo));
  const br=el("div","btnrow");const sv=el("button","btn",w?"저장":"담기");sv.type="submit";br.appendChild(sv);
  if(w){
    const mv=el("button","btn soft","할 일로 옮기기");mv.type="button";
    mv.addEventListener("click",()=>{const t=text.value.trim();if(t)w.text=t;moveWish(w);});
    const del=el("button","btn danger","삭제");del.type="button";
    armButton(del,"한 번 더 누르면 삭제",()=>{S.wishes=S.wishes.filter(x=>x.id!==w.id);save();closeSheet();render();toast("삭제했어요.");});
    br.append(mv,del);
  }
  sh.appendChild(br);
  sh.addEventListener("submit",e=>{
    e.preventDefault();const t=text.value.trim();if(!t){text.focus();return;}
    let k=kind.value;
    if(k==="__new"){const n=newK.value.trim();if(!n){newK.focus();return;}addCat("wish",n);k=n;}
    if(w){w.text=t;w.kind=k;w.memo=memo.value.trim();}
    else S.wishes.push({id:uid(),text:t,kind:k,memo:memo.value.trim(),done:false,created:Date.now()});
    save();closeSheet();render();toast(w?"저장했어요.":"위시리스트에 담았어요.");
  });
  if(!w) setTimeout(()=>text.focus(),50);
}

/* 업데이트: 앱을 다시 켜거나 다시 볼 때마다 새 버전을 확인하고, 있으면 바로 바꿔요 */
let swReg=null;
if("serviceWorker" in navigator){
  const hadController=!!navigator.serviceWorker.controller;let reloading=false;
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{swReg=r;}).catch(()=>{}));
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!hadController||reloading)return;reloading=true;
    if(!$("sheetRoot").firstChild){location.reload();}
    else toast("새 버전이 준비됐어요. 창을 닫으면 적용돼요.");
  });
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&swReg)swReg.update().catch(()=>{});});
}
})();
