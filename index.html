<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>체크리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — top bar, one scrolling view per screen (home / missions / mission / input / output / settings), floating add button, bottom sheet for forms */
:root{
  --bg:#f2f4f1; --card:#ffffff; --fg:#1d2a24; --muted:#6c7a72; --line:#dfe5e0; --accent:#2f6b4f; --accent-soft:#e2eee7;
  --warn:#b4542d; --warn-soft:#f7e6dd; --gold:#b8860b; --gold-soft:#f6ecd2;
  --in:#3c5f9e; --in-soft:#e4ebf7; --out:#9a4f2c; --out-soft:#f6e7de; --etc:#5d6670; --etc-soft:#e6e9ec; --wish:#6b4fa0; --wish-soft:#ece6f5;
  --wood:#c9a477; --wood-dark:#9c7748; --cabinet:#f6efe4; --bronze:#b0743c; --silver:#98a2ad; --goldcup:#d4a017;
  --hero:#dbe8e0; --hero-fg:#1d2a24; --hero-chip:rgba(255,255,255,.65); --hero-track:rgba(29,42,36,.12);
  --display:"Gowun Batang",Georgia,serif; --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1c2420;--fg:#e4ebe6;--muted:#93a29a;--line:#2c3732;--accent:#7cc39e;--accent-soft:#233229;--warn:#ef9a74;--warn-soft:#3a2720;--gold:#e9c46a;--gold-soft:#3a3320;--in:#8fb0ec;--in-soft:#1f2a3c;--out:#eba680;--out-soft:#3a2a21;--etc:#b4bcc5;--etc-soft:#262d33;--wish:#b9a1ec;--wish-soft:#2a2338;--wood:#7a5a3a;--wood-dark:#553e27;--cabinet:#211c17;--hero:#22302a;--hero-fg:#e4ebe6;--hero-chip:rgba(255,255,255,.07);--hero-track:rgba(255,255,255,.12);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:none;color:inherit;background:none;border-radius:12px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0;width:100%}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{flex:1;margin:0;font-family:var(--display);font-size:1.3rem;text-align:center;text-wrap:balance}
.iconbtn{width:40px;height:40px;display:grid;place-content:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--accent-soft);color:var(--fg)}
.iconbtn svg{width:22px;height:22px}

main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:4px calc(env(safe-area-inset-bottom,0px) + 96px);display:flex;flex-direction:column;gap:14px}

/* home: title block */
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:8px 4px}
.brand .logo{width:64px;height:64px;border-radius:18px;background:var(--accent);display:grid;place-content:center}
.brand .logo svg{width:34px;height:34px}
.brand h2{margin:0;font-family:var(--display);font-size:1.6rem}
.brand .date{color:var(--muted);font-size:.9rem}

/* main mission button */
.mission-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;background:var(--hero);color:var(--hero-fg);border-radius:16px;text-align:left}
.mission-btn .star{width:44px;height:44px;flex:none;border-radius:12px;background:var(--hero-chip);display:grid;place-content:center;color:var(--gold)}
.mission-btn .star svg{width:26px;height:26px}
.mission-btn .mb-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mission-btn .mb-title{font-weight:600;font-size:1.05rem}
.mission-btn .mb-sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{opacity:.6;font-size:1.3rem;flex:none}

/* input / output tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:16px;text-align:left;min-height:128px;border:1px solid transparent}
.tile.input{background:var(--in-soft);color:var(--in)}
.tile.output{background:var(--out-soft);color:var(--out)}
.tile.etc,.tile.wish{min-height:104px}
.tile.wish{background:var(--wish-soft);color:var(--wish)}
.tile .numeral{font-family:var(--display);font-size:2.2rem;line-height:1}
.tile .t-name{font-weight:600;font-size:1.1rem;color:var(--fg)}
.tile .t-desc{font-size:.8rem;color:var(--muted);line-height:1.35}
.tile .t-count{margin-top:auto;font-size:.85rem;font-weight:500;font-variant-numeric:tabular-nums}

/* section heads */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec h3{margin:0;font-size:.95rem;font-weight:600}
.sec span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:.82rem;color:var(--muted)}

/* task rows (cards) */
.rows{display:flex;flex-direction:column;gap:8px}
.row-card{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.row-card.p3{border-left:4px solid var(--warn)}
.row-card.p2{border-left:4px solid var(--gold)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;padding:0;border-radius:6px}
.row-text{word-break:break-word;font-weight:500}
.row-amount{font-size:.86rem}
.row-amount b{color:var(--accent);font-weight:600}
.row-amount span{color:var(--muted)}
.meta{display:flex;gap:5px;flex-wrap:wrap;font-size:.75rem;align-items:center}
.tag{padding:1px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.input{background:var(--in-soft);color:var(--in)}
.tag.output{background:var(--out-soft);color:var(--out)}
.tag.etc{background:var(--etc-soft);color:var(--etc)}
.tag.wish{background:var(--wish-soft);color:var(--wish)}
.tag.plain{background:var(--accent-soft);color:var(--fg)}
.tag.mission{background:var(--gold-soft);color:var(--gold)}
.tag.late,.tag.today{background:var(--warn-soft);color:var(--warn)}
.tag.late{font-weight:600}
.tag.quest{background:transparent;border:1px solid var(--line);color:var(--muted)}
.check{width:30px;height:30px;flex:none;border:2px solid var(--muted);border-radius:8px;display:grid;place-content:center}
.check.round{border-radius:50%}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"]::after{content:"";width:8px;height:14px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.row-card.done .row-text{color:var(--muted);text-decoration:line-through}
.row-card.done .meta,.row-card.done .row-amount{opacity:.55}
.more{padding:12px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);width:100%;font-size:.92rem}
.more:hover{color:var(--fg);border-color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.92rem;background:var(--card);border:1px dashed var(--line);border-radius:14px}

/* missions */
.m-card{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;width:100%}
.m-head{display:flex;align-items:center;gap:10px}
.m-title{flex:1;min-width:0;font-weight:600;font-size:1.05rem;word-break:break-word}
.lv{font-family:var(--display);font-size:.95rem;padding:2px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.xp{display:flex;flex-direction:column;gap:4px}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:5px;transition:width .5s}
.xp small{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.m-hero{background:var(--hero);color:var(--hero-fg);border:none}
.m-hero .xp small{color:var(--muted)}
.m-hero .xpbar{background:var(--hero-track)}
.m-hero .m-title{font-family:var(--display);font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:10px;background:var(--hero-chip)}
.stat b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1}
.btn{padding:10px 16px;background:var(--accent);color:var(--bg);font-weight:600;white-space:nowrap}
.btn.soft{background:var(--accent-soft);color:var(--fg)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 120px}

/* group screen */
.group-head{padding:16px;border-radius:16px;display:flex;flex-direction:column;gap:4px}
.group-head.input{background:var(--in-soft)}
.group-head.output{background:var(--out-soft)}
.group-head.etc{background:var(--etc-soft)}
.group-head.wish{background:var(--wish-soft)}
.group-head.wish .numeral{color:var(--wish)}
.group-head.etc .numeral{color:var(--etc)}
.group-head .numeral{font-family:var(--display);font-size:1.4rem}
.group-head.input .numeral{color:var(--in)}
.group-head.output .numeral{color:var(--out)}
.group-head p{margin:0;font-size:.88rem;color:var(--muted)}
.q-card{display:flex;flex-direction:column;gap:6px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.q-card .bar2{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.q-card .bar2 span{display:block;height:100%;background:var(--accent)}
.q-info{font-size:.82rem;color:var(--muted)}
details.done-box summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:6px 0}
details.done-box .rows{margin-top:8px}

/* settings */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:.95rem}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.subchip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border-radius:999px;font-size:.88rem}
.subchip button{padding:0 6px;font-size:1rem;line-height:1;opacity:.7}

/* fab */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--bg);font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:6;display:grid;place-content:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-family:var(--display);font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:.82rem;color:var(--muted)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg.group button[data-v=input][aria-pressed="true"]{background:var(--in-soft);color:var(--in)}
.seg.group button[data-v=output][aria-pressed="true"]{background:var(--out-soft);color:var(--out)}
.seg.group button[data-v=etc][aria-pressed="true"]{background:var(--etc-soft);color:var(--etc)}
.seg.prio button[data-v="3"][aria-pressed="true"]{background:var(--warn-soft);color:var(--warn)}
.seg.prio button[data-v="2"][aria-pressed="true"]{background:var(--gold-soft);color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;font-size:.9rem}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;color:var(--muted)}
.quick button:hover{color:var(--fg);border-color:var(--muted)}
/* missions list + trophy cabinet */
.m-row{display:flex;align-items:center;gap:10px;padding:14px 12px 14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.m-row .m-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;text-align:left;padding:0;border-radius:8px}
.cabinet{background:var(--cabinet);border:1px solid var(--line);border-radius:16px;padding:16px 14px 10px;display:flex;flex-direction:column;gap:18px}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:end;padding:0 2px 10px;position:relative}
.shelf::after{content:"";position:absolute;left:-8px;right:-8px;bottom:0;height:9px;border-radius:3px;background:linear-gradient(var(--wood),var(--wood-dark));box-shadow:0 4px 6px rgba(0,0,0,.12)}
.trophy{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px 6px;text-align:center;min-width:0;border-radius:10px}
.trophy:hover{background:rgba(0,0,0,.04)}
.trophy svg{width:46px;height:54px;flex:none}
.trophy .tt{font-size:.78rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.trophy .td{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.trophy.ghost{opacity:.35;pointer-events:none}
.trophy.new svg{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4) translateY(10px);opacity:0}60%{transform:scale(1.15)}100%{transform:none;opacity:1}}
.badge-done{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--gold)}
.hero-trophy{display:flex;align-items:center;gap:14px}
.hero-trophy svg{width:56px;height:66px;flex:none}
/* component modules in the add sheet */
.kind-pill{font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle;margin-left:8px;font-family:var(--body)}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.mod-head{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 12px;border-bottom:1px solid var(--line)}
.mod-name{flex:1;font-weight:600;font-size:.9rem}
.mod-lock{font-size:.75rem;color:var(--muted)}
.mod-x{width:30px;height:30px;color:var(--muted);font-size:1.1rem;line-height:1;border-radius:8px}
.mod-x:hover{background:var(--line);color:var(--fg)}
.mod-body{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mod-body input,.mod-body select{background:var(--card)}
.add-mod{padding:11px;border:1.5px dashed var(--line);border-radius:12px;color:var(--accent);font-weight:600;width:100%}
.add-mod:hover{border-color:var(--accent)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pick b{font-size:.9rem}
.pick span{font-size:.75rem;color:var(--muted);line-height:1.35}
.pick:disabled{opacity:.5;cursor:not-allowed}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.plan{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;background:var(--bg)}
.plan input{background:var(--card)}
.plan .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .r input{width:96px}
.plan .r span{font-size:.85rem;color:var(--muted)}
.preview{font-size:.9rem;color:var(--accent);font-weight:500}
.preview.err{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (max-width:360px){.tiles{gap:8px}.tile{padding:12px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.xpbar span{transition:none}}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="backBtn" aria-label="뒤로" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="iconbtn" id="backSpacer" aria-hidden="true"></span>
  <h1 id="screenTitle">체크리스트</h1>
  <button class="iconbtn" id="settingsBtn" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="추가">+</button>
<div id="sheetRoot"></div>

<script>
(function(){
"use strict";
/* ================= data ================= */
const LS="checklist-v4", OLD=["todo-items-v3","todo-items-v1"];
const DAYS=["일","월","화","수","목","금","토"], ORDER=[1,2,3,4,5,6,0];
const GROUPS={input:"인풋",output:"아웃풋",etc:"기타"};
const GKEYS=["input","output","etc"];
const GDESC={input:"독서·공부·영화·액티비티처럼 경험하고 받아들이는 것",output:"그림·글쓰기처럼 직접 만들어 내는 것",etc:"장보기·청소처럼 자잘한 일"};
const PRIO={3:"높음",2:"보통",1:"낮음"};
const WISH_KINDS=["보고 싶은 것","하고 싶은 것","가고 싶은 곳","갖고 싶은 것"];
let S={items:[],quests:[],missions:[],wishes:[],wishKinds:WISH_KINDS.slice(),subs:{input:["독서","공부","영화","액티비티"],output:["그림","글쓰기","만들기"],etc:["생활","업무","약속"]}};
let homeLimit=8, homeMission="", homeTab="today";

const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));

function load(){
  let raw=null;
  try{raw=localStorage.getItem(LS);if(!raw)for(const k of OLD){raw=localStorage.getItem(k);if(raw)break;}}catch(e){}
  if(raw){try{merge(JSON.parse(raw));}catch(e){}}
}
function merge(d){
  if(!d) return;
  if(Array.isArray(d.items)) S.items=d.items.map(i=>{
    const o={...i};
    if(o.group===undefined){const c=o.cat||"";delete o.cat;if(c==="영화"){o.group="input";o.sub="영화";}else if(c==="자기개발"){o.group="input";o.sub="공부";}else{o.group="etc";o.sub=c;}}
    if(!o.group)o.group="etc";
    if(!o.prio)o.prio=2; if(o.mission===undefined)o.mission="";
    if(o.done&&!o.doneAt)o.doneAt="";
    return o;
  });
  if(Array.isArray(d.quests)) S.quests=d.quests.map(q=>({mission:"",prio:2,...q,group:q.group||"etc",log:q.log||{}}));
  if(Array.isArray(d.missions)) S.missions=clone(d.missions);
  if(Array.isArray(d.wishes)) S.wishes=clone(d.wishes);
  if(Array.isArray(d.wishKinds)) S.wishKinds=d.wishKinds.slice();
  if(d.subs&&d.subs.input&&d.subs.output){const def=S.subs.etc;S.subs=clone(d.subs);if(!S.subs.etc)S.subs.etc=def;}
}
function save(){
  try{localStorage.setItem(LS,JSON.stringify({v:4,...S}));}catch(e){toast("저장 공간에 저장하지 못했어요.");}
}

/* ================= quest math ================= */
function countSessions(days,start,span){let n=0;const d=parse(start);for(let i=0;i<span;i++){if(days.includes(d.getDay()))n++;d.setDate(d.getDate()+1);}return n;}
const doneBefore=(q,day)=>Object.keys(q.log||{}).filter(k=>q.log[k]&&k<day).length;
const doneTotal=q=>Object.keys(q.log||{}).filter(k=>q.log[k]).length;
function chunk(q,day){const p=q.plan,idx=doneBefore(q,day);const from=idx*p.per+1,to=Math.min(p.total,(idx+1)*p.per);return{idx,from,to,amt:to-from+1};}
const finished=q=>q.plan&&doneTotal(q)>=q.plan.sessions;
function isTodayQuest(q){
  const t=today(); if(!q.days.includes(new Date().getDay())) return false;
  if(q.plan&&t<q.plan.start) return false;
  if(q.plan&&doneBefore(q,t)>=q.plan.sessions) return false;
  return true;
}
function nextDay(q){const d=new Date();for(let i=1;i<=7;i++){d.setDate(d.getDate()+1);if(q.days.includes(d.getDay()))return i===1?"내일":DAYS[d.getDay()]+"요일";}return "";}
const daysLeft=due=>due?Math.round((parse(due)-parse(today()))/86400000):Infinity;

/* ================= mission XP ================= */
// 할 일 만들기 +10 · 할 일 완료 +30 · 퀘스트 만들기 +10 · 퀘스트 1회 완료 +15
function missionStats(m){
  const its=S.items.filter(i=>i.mission===m.id), qs=S.quests.filter(q=>q.mission===m.id);
  const done=its.filter(i=>i.done).length, checks=qs.reduce((a,q)=>a+doneTotal(q),0);
  const xp=its.length*10+done*30+qs.length*10+checks*15;
  let lv=1,rest=xp,need=100;
  while(rest>=need){rest-=need;lv++;need=100+(lv-1)*50;}
  return {its,qs,made:its.length+qs.length,done,checks,xp,lv,rest,need};
}

const activeMissions=()=>S.missions.filter(m=>!m.done);
const tierOf=lv=>lv>=6?"goldcup":lv>=3?"silver":"bronze";
function trophySVG(tier){
  return `<svg viewBox="0 0 40 48" aria-hidden="true"><path d="M10 7H6a5 5 0 0 0 5 9" fill="none" style="stroke:var(--${tier})" stroke-width="2.4"/><path d="M30 7h4a5 5 0 0 1-5 9" fill="none" style="stroke:var(--${tier})" stroke-width="2.4"/><path d="M10 3h20v11a10 10 0 0 1-20 0z" style="fill:var(--${tier})"/><path d="M14 6h3v8a6 6 0 0 0 2.5 5" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/><rect x="17.5" y="24" width="5" height="7" style="fill:var(--${tier})"/><rect x="11" y="31" width="18" height="4" rx="1.2" style="fill:var(--${tier})"/><rect x="8" y="36" width="24" height="9" rx="2" style="fill:var(--wood-dark)"/></svg>`;
}
const fmtDate=d=>d?d.replace(/-/g,"."):"";
let freshTrophy="";
function completeMission(m){
  const s=missionStats(m);
  m.done=true;m.doneAt=today();m.trophy={lv:s.lv,xp:s.xp,made:s.made};
  freshTrophy=m.id;save();
  toast(`★ ${m.title} 달성! 트로피 진열장에 올렸어요`);
}
function reopenMission(m){m.done=false;delete m.doneAt;delete m.trophy;save();toast("다시 진행 중으로 옮겼어요.");}
function deleteMission(m){
  S.missions=S.missions.filter(x=>x.id!==m.id);
  [...S.items,...S.quests].forEach(x=>{if(x.mission===m.id)x.mission="";});
  save();toast("미션을 삭제했어요. 연결된 할 일은 남아 있어요.");
}
function armButton(btn,confirmText,fn){
  let armed=false;const orig=btn.textContent;
  btn.addEventListener("click",()=>{if(!armed){armed=true;btn.textContent=confirmText;setTimeout(()=>{armed=false;btn.textContent=orig;},3000);return;}fn();});
}

/* ================= shared row builders ================= */
function tagsFor(o,{showMission=true}={}){
  const m=el("span","meta");
  if(o.group){m.appendChild(el("span","tag "+o.group,GROUPS[o.group]+(o.sub?" · "+o.sub:"")));}
  if(showMission&&o.mission){const mi=S.missions.find(x=>x.id===o.mission);if(mi)m.appendChild(el("span","tag mission","★ "+mi.title));}
  return m;
}
function dueTag(it){
  if(!it.due) return null;
  const n=daysLeft(it.due), d=parse(it.due);
  const cls=it.done?"plain":n<0?"late":n===0?"today":"plain";
  return el("span","tag "+cls,`${d.getMonth()+1}/${d.getDate()} · `+(n<0?`${-n}일 지남`:n===0?"오늘 마감":`D-${n}`));
}
function checkBtn(on,round,label,fn){
  const b=el("button","check"+(round?" round":""));b.setAttribute("role","checkbox");b.setAttribute("aria-checked",String(on));b.setAttribute("aria-label",label);
  b.addEventListener("click",fn);return b;
}
function taskRow(it,opts={}){
  const c=el("div","row-card"+(it.done?" done":"")+(!it.done&&it.prio==3?" p3":!it.done&&it.prio==2&&opts.showPrio?" p2":""));
  const main=el("button","row-main"); main.type="button";
  main.appendChild(el("span","row-text",it.text));
  const m=tagsFor(it,opts); const dt=dueTag(it); if(dt) m.prepend(dt);
  if(it.prio==3&&!it.done) m.prepend(el("span","tag late","중요"));
  if(m.childNodes.length) main.appendChild(m);
  main.addEventListener("click",()=>openSheet({mode:"edit-task",id:it.id}));
  c.append(main,checkBtn(!!it.done,false,it.text+" 완료",()=>{
    it.done=!it.done; it.doneAt=it.done?today():"";
    if(it.done&&it.mission) xpToast(it.mission,30);
    save(); render();
  }));
  return c;
}
function questRow(q,opts={}){
  const t=today(), on=!!q.log[t];
  const c=el("div","row-card"+(on?" done":"")+(!on&&q.prio==3?" p3":""));
  const main=el("button","row-main"); main.type="button";
  main.appendChild(el("span","row-text",q.title));
  if(q.plan){const ch=chunk(q,t);const a=el("span","row-amount");a.append("오늘 ",el("b",null,`${ch.amt}${q.plan.unit}`)," ",el("span",null,`(${ch.from}~${ch.to} · ${ch.idx+1}/${q.plan.sessions}회)`));main.appendChild(a);}
  const m=tagsFor(q,opts); m.prepend(el("span","tag quest","↻ 오늘 퀘스트"));
  main.appendChild(m);
  main.addEventListener("click",()=>openSheet({mode:"edit-quest",id:q.id}));
  c.append(main,checkBtn(on,true,q.title+" 오늘 완료",()=>{
    if(on) delete q.log[t]; else {q.log[t]=true; if(q.mission) xpToast(q.mission,15);}
    save(); render();
  }));
  return c;
}
function questCard(q){
  const b=el("button","q-card"); b.type="button";
  b.appendChild(el("span","row-text",q.title));
  const ds=ORDER.filter(d=>q.days.includes(d)).map(d=>DAYS[d]).join("·");
  if(q.plan){
    const n=Math.min(doneTotal(q),q.plan.sessions);
    b.appendChild(el("span","q-info",`${ds} · ${q.plan.total}${q.plan.unit}를 ${q.plan.sessions}회에 · `+(n>=q.plan.sessions?"모두 완료":`${n}/${q.plan.sessions}회`)));
    const bar=el("div","bar2"),s=el("span");s.style.width=(n/q.plan.sessions*100)+"%";bar.appendChild(s);b.appendChild(bar);
  } else b.appendChild(el("span","q-info",`${ds} 반복 · ${doneTotal(q)}회 완료`+(isTodayQuest(q)?" · 오늘":` · 다음: ${nextDay(q)}`)));
  b.appendChild(tagsFor(q));
  b.addEventListener("click",()=>openSheet({mode:"edit-quest",id:q.id}));
  return b;
}
function sortTasks(arr){
  return arr.slice().sort((a,b)=>{
    const da=a._quest?0:daysLeft(a.due), db=b._quest?0:daysLeft(b.due);
    if(da!==db) return da-db;
    if((b.prio||2)!==(a.prio||2)) return (b.prio||2)-(a.prio||2);
    return (a.created||0)-(b.created||0);
  });
}
function xpBlock(st){
  const w=el("div","xp");const bar=el("div","xpbar"),s=el("span");s.style.width=(st.rest/st.need*100)+"%";bar.appendChild(s);
  const sm=el("small");sm.append(el("span",null,`${st.rest} / ${st.need} XP`),el("span",null,`누적 ${st.xp} XP`));
  w.append(bar,sm);return w;
}

  brand.append(logo,el("h2",null,"체크리스트"),el("span","date",new Date().toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"})));

    const t=el("button","tile "+g);t.type="button";
    const open=S.items.filter(x=>x.group===g&&!x.done).length, tq=S.quests.filter(q=>q.group===g&&isTodayQuest(q)&&!q.log[today()]).length;
    t.append(el("span","t-name",GROUPS[g]),el("span","t-desc",GDESC[g]),el("span","t-count",`할 일 ${open}`+(tq?` · 오늘 퀘스트 ${tq}`:"")));
    t.addEventListener("click",()=>go(g));

  wt.addEventListener("click",()=>go("wish"));

  const t=today();
  const TABS=[["today","오늘"],["all","전체"],["mission","메인 미션"]];
  const quests=S.quests.filter(isTodayQuest).map(q=>({...q,_quest:true,_ref:q}));
  const pick={
    today:o=>o._quest||(o.due&&o.due<=t),
    all:()=>true,
    mission:o=>(o._quest?o._ref.mission:o.mission)&&(!homeMission||(o._quest?o._ref.mission:o.mission)===homeMission)
  }[homeTab];
  const open=S.items.filter(i=>!i.done);
  const doneToday=S.items.filter(i=>i.done&&i.doneAt===t);
  const list=sortTasks([...quests.filter(q=>!q._ref.log[t]),...open]).filter(pick);
  const finished=[...quests.filter(q=>q._ref.log[t]),...doneToday].filter(homeTab==="today"?()=>true:pick);
  const total=list.length+finished.length;

  const sec=el("div","sec");sec.append(el("h3",null,"할 일"),el("span",null,total?`완료 ${finished.length} · 남은 일 ${list.length}`:""));
  v.appendChild(sec);
  const tabs=seg("tabs",TABS,homeTab,k=>{homeTab=k;homeLimit=8;try{localStorage.setItem("checklist-hometab",k);}catch(e){}render();});
  v.appendChild(tabs);

  const area=el("div","rows");

      area.appendChild(el("div","empty","아직 메인 미션이 없어요. 위의 메인 미션 버튼에서 큰 목표를 먼저 만들어 보세요."));
    } else {

      if(homeMission&&!S.missions.some(m=>m.id===homeMission))homeMission="";
      sel.value=homeMission;sel.addEventListener("change",()=>{homeMission=sel.value;homeLimit=8;render();});
      area.appendChild(sel);
    }

  if(!total&&!(homeTab==="mission"&&!S.missions.length)){
    let msg="할 일이 없어요. 오른쪽 아래 + 버튼으로 추가해 보세요.";
    if(homeTab==="today"){
      const upcoming=open.filter(i=>!i.due||i.due>t).length;
      msg=upcoming?`오늘 할 일이 없어요. 남은 할 일 ${upcoming}개는 '전체'에서 볼 수 있어요.`:"오늘 할 일이 없어요. + 버튼으로 추가할 때 마감일을 '오늘'로 정하면 여기에 나와요.";

    area.appendChild(el("div","empty",msg));

    const more=el("button","more",`더보기 (${list.length-homeLimit}개 더)`);more.type="button";

    const d=el("details","done-box");d.appendChild(el("summary",null,`오늘 끝낸 일 ${finished.length}개`));
    const r=el("div","rows");finished.forEach(o=>r.appendChild(o._quest?questRow(o._ref):taskRow(o)));d.appendChild(r);v.appendChild(d);
  }

  // 좌우로 밀어서 탭 넘기기
  let sx=0,sy=0,tracking=false;
  const zone=[tabs,area];
  zone.forEach(z=>{
    z.addEventListener("touchstart",e=>{if(e.target.closest("select"))return;tracking=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
    z.addEventListener("touchend",e=>{
      if(!tracking)return;tracking=false;
      const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;

      const i=TABS.findIndex(x=>x[0]===homeTab),n=i+(dx<0?1:-1);
      if(n<0||n>=TABS.length)return;
      homeTab=TABS[n][0];homeLimit=8;try{localStorage.setItem("checklist-hometab",homeTab);}catch(err){}render();
    },{passive:true});
  });

function route(){const h=location.hash.replace(/^#\/?/,"");return h||"home";}

  const r=route(), v=$("view"); const y=window.scrollY;

  $("backBtn").hidden=home; $("backSpacer").hidden=!home;
  $("fab").hidden=r==="settings";

  sub.addEventListener("change",()=>{newSub.hidden=sub.value!=="__new";if(sub.value!=="__new")st.sub=sub.value;else newSub.focus();});
  fillSubs();
  const subWrap=el("div","field");subWrap.append(el("span","lbl","세부 카테고리"),sub,newSub);
  const prioWrap=field("중요도",seg("prio",[["1","낮음"],["2","보통"],["3","높음"]],st.prio,v=>st.prio=+v));
  const two=el("div","two");two.append(subWrap,prioWrap);sh.appendChild(two);

  /* --- module bodies (built once so values survive add/remove) --- */
  const due=el("input");due.type="date";due.id="f-due";due.value=src&&src.due?src.due:"";due.setAttribute("aria-label","희망 마감일");
  const quick=el("div","quick");
  [["오늘",0],["내일",1],["이번 주말",-1]].forEach(([l,n])=>{const b=el("button",null,l);b.type="button";
    b.addEventListener("click",()=>{const d=new Date();if(n===-1){d.setDate(d.getDate()+((6-d.getDay()+7)%7));}else d.setDate(d.getDate()+n);due.value=ymd(d);});quick.appendChild(b);});
  const dueBody=[due,quick];

  const dayBox=el("div","days");
  const dErr=el("span","preview err","반복할 요일을 하나 이상 골라 주세요.");dErr.hidden=true;
  ORDER.forEach(d=>{const b=el("button",null,DAYS[d]);b.type="button";b.setAttribute("aria-pressed",String(st.days.includes(d)));b.setAttribute("aria-label",DAYS[d]+"요일");
    b.disabled=isQuestEdit;
    b.addEventListener("click",()=>{if(st.days.includes(d))st.days=st.days.filter(x=>x!==d);else st.days.push(d);b.setAttribute("aria-pressed",String(st.days.includes(d)));dErr.hidden=true;preview();});dayBox.appendChild(b);});
  const repeatBody=[dayBox,dErr];
  if(isQuestEdit) repeatBody.push(el("span","hint","요일은 만든 뒤에 바꿀 수 없어요."));

  const total=el("input");total.type="number";total.min="1";total.inputMode="numeric";total.placeholder="320";total.id="f-total";total.setAttribute("aria-label","총 분량");
  const unit=el("input");unit.type="text";unit.value="페이지";unit.maxLength=8;unit.id="f-unit";unit.setAttribute("aria-label","단위");
  const span=el("input");span.type="number";span.min="1";span.inputMode="numeric";span.placeholder="14";span.id="f-span";span.setAttribute("aria-label","기간(일)");
  const r1=el("div","r");r1.append(el("span",null,"총 분량"),total,unit);
  const r2=el("div","r");r2.append(el("span",null,"오늘부터"),span,el("span",null,"일 동안"));
  const pv=el("div","preview","총 분량과 기간을 넣으면 한 번에 할 분량을 계산해 드려요.");
  [total,span,unit].forEach(x=>x.addEventListener("input",preview));
  const planWrap=el("div","plan");planWrap.style.padding="0";planWrap.style.background="none";
  if(isQuestEdit&&src.plan){planWrap.appendChild(el("span","hint",`${src.plan.total}${src.plan.unit}를 ${src.plan.sessions}회에 나눠서 · 한 번에 ${src.plan.per}${src.plan.unit} · 만든 뒤에는 바꿀 수 없어요.`));}
  else planWrap.append(r1,r2,pv);
  const planBody=[planWrap];

  const mis=el("select");mis.id="f-mission";mis.setAttribute("aria-label","메인 미션");
  activeMissions().forEach(m=>{const op=el("option",null,"★ "+m.title);op.value=m.id;mis.appendChild(op);});
  if(linkedMission){const lm=S.missions.find(m=>m.id===linkedMission);if(lm&&lm.done){const op=el("option",null,"★ "+lm.title+" (달성)");op.value=lm.id;mis.appendChild(op);}}
  if(linkedMission)mis.value=linkedMission;
  const missionBody=[mis,el("span","hint","만들면 +10, 완료할 때마다 경험치가 쌓여요.")];

  const MODS={
    due:{name:"희망 마감일",desc:"언제까지 끝낼지 정해요. 오늘 탭 기준이 돼요",body:dueBody},
    repeat:{name:"반복 요일",desc:"고른 요일마다 오늘 할 일에 나타나요",body:repeatBody},
    plan:{name:"분량 나누기",desc:"총 분량을 기간에 맞춰 한 번 분량으로 나눠요",body:planBody},
    mission:{name:"메인 미션 연결",desc:"완료할 때마다 미션 경험치가 쌓여요",body:missionBody}
  };
  const MORDER=["due","repeat","plan","mission"];
  function availability(k){ // false = hide, string = disabled reason, null = ok
    if(st.mods.has(k)) return false;
    if(o.mode==="edit-task"&&(k==="repeat"||k==="plan")) return false;
    if(isQuestEdit&&k!=="mission") return false;
    if(k==="due"&&st.mods.has("repeat")) return "반복 요일과 함께 쓸 수 없어요";
    if((k==="repeat"||k==="plan")&&st.mods.has("due")) return "희망 마감일과 함께 쓸 수 없어요";
    if(k==="mission"&&!mis.options.length) return "메인 미션을 먼저 만들어 주세요";
    return null;
  }

  sh.appendChild(el("span","lbl","기능"));
  const modsBox=el("div","mods");sh.appendChild(modsBox);
  const addBtn=el("button","add-mod","+ 기능 추가");addBtn.type="button";
  const picker=el("div","picker");picker.hidden=true;
  sh.append(addBtn,picker);
  addBtn.addEventListener("click",()=>{picker.hidden=!picker.hidden;renderPicker();});

  function renderMods(){
    modsBox.innerHTML="";
    MORDER.filter(k=>st.mods.has(k)).forEach(k=>{
      const card=el("div","mod");const head=el("div","mod-head");
      head.appendChild(el("span","mod-name",MODS[k].name));
      if(locked.has(k)) head.appendChild(el("span","mod-lock","고정"));
      else {const x=el("button","mod-x","×");x.type="button";x.setAttribute("aria-label",MODS[k].name+" 빼기");
        x.addEventListener("click",()=>{st.mods.delete(k);if(k==="repeat")st.mods.delete("plan");if(k==="due")due.value="";renderMods();});head.appendChild(x);}
      const body=el("div","mod-body");MODS[k].body.forEach(n=>body.appendChild(n));
      card.append(head,body);modsBox.appendChild(card);
    });
    const any=MORDER.some(k=>availability(k)!==false);
    addBtn.hidden=!any;if(!any)picker.hidden=true;
    renderPicker();sync();
  }
  function renderPicker(){
    if(picker.hidden) return;
    picker.innerHTML="";
    MORDER.forEach(k=>{
      const a=availability(k);if(a===false)return;
      const p=el("button","pick");p.type="button";p.append(el("b",null,"+ "+MODS[k].name),el("span",null,a||MODS[k].desc));
      p.disabled=!!a;
      p.addEventListener("click",()=>{
        st.mods.add(k);if(k==="plan")st.mods.add("repeat");
        picker.hidden=true;renderMods();
        const first=modsBox.querySelector(`.mod:nth-child(${MORDER.filter(x=>st.mods.has(x)).indexOf(k)+1}) input, .mod:nth-child(${MORDER.filter(x=>st.mods.has(x)).indexOf(k)+1}) select, .mod:nth-child(${MORDER.filter(x=>st.mods.has(x)).indexOf(k)+1}) button:not(.mod-x)`);
        if(first&&k!=="due")first.focus();
        preview();
      });
      picker.appendChild(p);
    });
  }

  function calc(){
    const T=parseInt(total.value,10),N=parseInt(span.value,10);
    if(!st.days.length) return {err:"반복 요일을 먼저 골라 주세요."};
    if(!(T>0)||!(N>0)) return {err:"총 분량과 기간을 넣으면 한 번에 할 분량을 계산해 드려요."};
    const n=countSessions(st.days,today(),N); if(!n) return {err:"이 기간 안에 고른 요일이 없어요. 기간을 늘려 주세요."};
    return {total:T,span:N,sessions:n,per:Math.ceil(T/n),unit:unit.value.trim()||"페이지"};
  }
  function preview(){
    if(!st.mods.has("plan")||isQuestEdit) return; const c=calc();
    if(c.err){pv.textContent=c.err;pv.classList.add("err");return;}
    pv.classList.remove("err");const e=new Date();e.setDate(e.getDate()+c.span-1);
    pv.textContent=`총 ${c.sessions}회 · 한 번에 ${c.per}${c.unit}씩 (${e.getMonth()+1}/${e.getDate()}까지)`;
  }
  const isQuest=()=>st.mods.has("repeat");
  function sync(){
    pill.textContent=isQuest()?"반복 퀘스트":"할 일";
    save1.textContent=editing?"저장":(isQuest()?"반복 퀘스트 추가":"할 일 추가");
  }

  const br=el("div","btnrow");const save1=el("button","btn");save1.type="submit";br.appendChild(save1);
  if(editing){
    const del=el("button","btn danger","삭제");del.type="button";
    armButton(del,"한 번 더 누르면 삭제",()=>{
      if(isQuestEdit)S.quests=S.quests.filter(x=>x.id!==src.id);else S.items=S.items.filter(x=>x.id!==src.id);
      save();closeSheet();render();toast("삭제했어요.");});
    br.appendChild(del);
  }
  sh.appendChild(br);
  renderMods();

  sh.addEventListener("submit",e=>{
    e.preventDefault();
    const t=title.value.trim();if(!t){title.focus();return;}
    if(sub.value==="__new"){const n=newSub.value.trim();if(!n){newSub.focus();return;}if(!S.subs[st.group].includes(n))S.subs[st.group].push(n);st.sub=n;}
    const mission=st.mods.has("mission")?mis.value:"";
    const dueVal=st.mods.has("due")?(due.value||""):"";
    const newLink=mission&&mission!==(src?src.mission:"");
    if(editing){
      if(isQuestEdit)src.title=t;else{src.text=t;src.due=dueVal;}
      Object.assign(src,{group:st.group,sub:st.sub,mission,prio:st.prio});
      save();closeSheet();render();toast(newLink?"저장했어요. 미션 경험치 +10":"저장했어요.");return;
    }
    if(!isQuest()){
      S.items.push({id:uid(),text:t,done:false,doneAt:"",group:st.group,sub:st.sub,mission,prio:st.prio,due:dueVal,created:Date.now()});
    } else {
      if(!st.days.length){dErr.hidden=false;dayBox.querySelector("button").focus();return;}
      let p=null;if(st.mods.has("plan")){const c=calc();if(c.err){pv.textContent=c.err;pv.classList.add("err");total.focus();return;}p={total:c.total,unit:c.unit,sessions:c.sessions,per:c.per,start:today()};}
      S.quests.push({id:uid(),title:t,group:st.group,sub:st.sub,mission,prio:st.prio,days:st.days.slice(),plan:p,log:{},created:Date.now()});
    }
    if(o.fromWish){S.wishes=S.wishes.filter(w=>w.id!==o.fromWish);}
    save();closeSheet();render();
    if(o.fromWish)toast("위시를 할 일로 옮겼어요.");else if(mission)xpToast(mission,10);else toast("추가했어요.");
  });
  if(!editing) setTimeout(()=>title.focus(),50);
}

function wishSheet(sh,o){
  const w=o.mode==="edit-wish"?S.wishes.find(x=>x.id===o.id):null;
  sh.appendChild(el("h3",null,w?"위시 수정":"위시리스트에 추가"));
  const text=el("input");text.type="text";text.id="w-text";text.maxLength=120;text.placeholder="예: 『듄』 영화 보기";text.value=w?w.text:"";
  sh.appendChild(field("무엇을",text));
  const kind=el("select");kind.id="w-kind";
  const add=(v,t)=>{const op=el("option",null,t);op.value=v;kind.appendChild(op);};
  add("","종류 없음");const kinds=S.wishKinds.slice();if(w&&w.kind&&!kinds.includes(w.kind))kinds.push(w.kind);kinds.forEach(k=>add(k,k));
  kind.value=w?(w.kind||""):(o.kind||S.wishKinds[0]||"");
  sh.appendChild(field("종류",kind));
  const memo=el("textarea");memo.id="w-memo";memo.rows=2;memo.maxLength=300;memo.placeholder="메모 (예: 친구 추천, 넷플릭스에 있음)";memo.value=w?(w.memo||""):"";
  sh.appendChild(field("메모",memo));
  const br=el("div","btnrow");const sv=el("button","btn",w?"저장":"추가");sv.type="submit";br.appendChild(sv);
  sh.appendChild(br);
  if(w){
    const br2=el("div","btnrow");
    const mv=el("button","btn soft","할 일로 옮기기");mv.type="button";
    mv.addEventListener("click",()=>{const t=text.value.trim()||w.text;openSheet({mode:"new",title:t,group:"input",fromWish:w.id});});
    const dn=el("button","btn soft",w.done?"다시 위시로":"이뤘어요");dn.type="button";
    dn.addEventListener("click",()=>{w.done=!w.done;w.doneAt=w.done?today():"";save();closeSheet();render();toast(w.done?"이뤘어요! '이룬 것'에 남겨 둘게요.":"다시 위시리스트로 옮겼어요.");});
    const del=el("button","btn danger","삭제");del.type="button";
    armButton(del,"한 번 더 누르면 삭제",()=>{S.wishes=S.wishes.filter(x=>x.id!==w.id);save();closeSheet();render();toast("삭제했어요.");});
    br2.append(mv,dn,del);sh.appendChild(br2);
  }
  sh.addEventListener("submit",e=>{
    e.preventDefault();const t=text.value.trim();if(!t){text.focus();return;}
    if(w){w.text=t;w.kind=kind.value;w.memo=memo.value.trim();}
    else S.wishes.push({id:uid(),text:t,kind:kind.value,memo:memo.value.trim(),done:false,created:Date.now()});
    save();closeSheet();render();toast(w?"저장했어요.":"위시리스트에 담았어요.");
  });
  if(!w) setTimeout(()=>text.focus(),50);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

/* ================= boot ================= */
load(); render();
let lastDay=today();
setInterval(()=>{if(today()!==lastDay){lastDay=today();render();}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&today()!==lastDay){lastDay=today();render();}});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
})();
</script>
</body>
</html>
